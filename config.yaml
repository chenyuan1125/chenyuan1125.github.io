locale: zh-cn
theme: hugo-theme-stack
title: Lee's Blog
copyright: Lee
paginate: 5
taxonomies:
  # 标签
  tag: tags
  # 分类
  category: categories
  # 系列
  series: series

# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: zh-cn

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: true

languages:
  en:
    label: English
    contentDir: content/en
    title: Lee
    weight: 1
    menu:
      main:
        - identifier: home
          name: Home
          url: /en/
          weight: -100
          params:
            icon: home

        - identifier: search
          name: Search
          url: /en/search/
          weight: -90
          params:
            icon: search

        - identifier: archives
          name: Archives
          url: /en/archives/
          weight: -80
          params:
            icon: archives

        - identifier: about
          name: About
          url: /en/page/about/
          weight: -70
          params:
            icon: user

        - identifier: links
          name: Links
          url: /en/page/links/
          weight: -60
          params:
            icon: link
      social:
        - identifier: github
          name: GitHub
          url: https://github.com/chenyuan1125
          params:
            icon: brand-github
        - identifier: home
          name: Home
          url: /en/
          weight: -100
          params:
            newTab: false
            icon: home
    params:
      description: Stay hungry, Stay foolish.
  zh-cn:
    label: 中文
    contentDir: content/cn
    title: 辰远
    weight: 2
    menu:
      main:
        - identifier: home
          name: 主页
          url: /
          weight: -100
          params:
            icon: home

        - identifier: search
          name: 搜索
          url: /search/
          weight: -90
          params:
            icon: search

        - identifier: archives
          name: 归档
          url: /archives/
          weight: -80
          params:
            icon: archives

        - identifier: about
          name: 关于
          url: /%E5%85%B3%E4%BA%8E/
          weight: -70
          params:
            icon: user

        - identifier: links
          name: 链接
          url: /%E9%93%BE%E6%8E%A5/
          weight: -60
          params:
            icon: link
      social:
        - identifier: github
          name: GitHub
          url: https://github.com/chenyuan1125
          params:
            icon: brand-github
        - identifier: home
          name: 首页&关于
          url: /
          weight: -100
          params:
            newTab: false
            icon: home
    params:
      description: 智者不入爱河

services:
  # Change it to your Disqus shortname before using
  disqus:
    shortname: "hugo-theme-stack"
  # GA Tracking ID
  googleAnalytics:
    id:

pagination:
  pagerSize: 5

permalinks:
  post: /p/:slug/
  page: /:slug/

params:
  mainSections:
    - post
  featuredImageField: image
  rssFullContent: true
  favicon: # e.g.: favicon placed in `static/favicon.ico` of your site folder, then set this field to `/favicon.ico` (`/` is necessary)

  footer:
    since: 2020
    customText:

  dateFormat:
    published: "2006-01-02"
    lastUpdated: "2006-01-02"

  sidebar:
    emoji: 🍥
    subtitle: 天将降大任于斯人也
    avatar: img/avatar.png

  article:
    math: true
    toc: true
    readingTime: true
    license:
      enabled: true
      default: Licensed under CC BY-NC-SA 4.0

  comments:
    enabled: true
    provider: waline

    disqusjs:
      shortname:
      apiUrl:
      apiKey:
      admin:
      adminLabel:

    utterances:
      repo:
      issueTerm: pathname
      label:

    beaudar:
      repo:
      issueTerm: pathname
      label:
      theme:

    remark42:
      host:
      site:
      locale:

    vssue:
      platform:
      owner:
      repo:
      clientId:
      clientSecret:
      autoCreateIssue: false

    # Waline client configuration see: https://waline.js.org/en/reference/component.html
    waline:
      serverURL: https://waline.chenyuan1125.top
      lang: zh-CN
      pageview: true
      emoji:
        - https://cdn.jsdelivr.net/gh/walinejs/emojis@1.0.0/qq
        - https://cdn.jsdelivr.net/gh/walinejs/emojis@1.0.0/bilibili
      requiredMeta:
        - nick
        # - email
        # - url
      locale:
        admin: Admin
        placeholder: 感谢您的评论

    twikoo:
      envId:
      region:
      path:
      lang:

    # See https://cactus.chat/docs/reference/web-client/#configuration for description of the various options
    cactus:
      defaultHomeserverUrl: "https://matrix.cactus.chat:8448"
      serverName: "cactus.chat"
      siteName: "" # You must insert a unique identifier here matching the one you registered (See https://cactus.chat/docs/getting-started/quick-start/#register-your-site)

    giscus:
      repo:
      repoID:
      category:
      categoryID:
      mapping:
      lightTheme:
      darkTheme:
      reactionsEnabled: 1
      emitMetadata: 0

    gitalk:
      owner:
      admin:
      repo:
      clientID:
      clientSecret:
      proxy:

    cusdis:
      host:
      id:
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 10
    page:
      - type: toc

  opengraph:
    twitter:
      # Your Twitter username
      site:

      # Available values: summary, summary_large_image
      card: summary_large_image

  defaultImage:
    opengraph:
      enabled: false
      local: false
      src:

  colorScheme:
    # Display toggle
    toggle: true

    # Available values: auto, light, dark
    default: auto

  imageProcessing:
    cover:
      enabled: true
    content:
      enabled: true

### Custom menu
### See https://stack.jimmycai.com/config/menu
### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100

    - name: categories
      weight: 200

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
    renderer:
      ## Set to true if you have HTML content inside Markdown
      unsafe: true
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4

frontmatter:
  date: ["date", "lastmod", "publishDate"]
  lastmod: [":fileModTime", "lastmod", ":git", ":default"]
