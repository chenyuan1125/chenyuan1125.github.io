<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="520" fill="#fafafa" rx="8"/>

  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">In-Context Learning 机制：Meta-Learning 框架</text>

  <!-- 外循环 box -->
  <rect x="30" y="55" width="280" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="170" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">预训练语料（海量文本）</text>

  <!-- 模型 box -->
  <rect x="30" y="170" width="280" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="170" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">语言模型（GPT-3 175B）</text>

  <!-- 权重更新 box -->
  <rect x="30" y="370" width="280" height="50" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="170" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#7e22ce">模型参数更新（梯度下降）</text>

  <!-- 内循环 box -->
  <rect x="420" y="55" width="280" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="560" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">上下文示例（K 个示例 + 查询）</text>

  <!-- 隐式梯度 box -->
  <rect x="420" y="170" width="280" height="120" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="560" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">Forward Pass 隐式梯度</text>
  <text x="560" y="225" text-anchor="middle" font-size="12" fill="#9a3412">注意力 = 梯度下降</text>
  <text x="560" y="248" text-anchor="middle" font-size="12" fill="#9a3412">Key/Value 查询 = 参数更新</text>
  <text x="560" y="271" text-anchor="middle" font-size="12" fill="#9a3412">无需反向传播</text>

  <!-- 输出 box -->
  <rect x="420" y="370" width="280" height="50" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="560" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">输出预测</text>

  <!-- 箭头 1: 语料→模型 -->
  <line x1="170" y1="105" x2="170" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 箭头 2: 示例→隐式梯度 -->
  <line x1="560" y1="105" x2="560" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 箭头 3: 隐式梯度→输出 -->
  <line x1="560" y1="290" x2="560" y2="370" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 箭头 4: 模型→权重更新 -->
  <line x1="170" y1="230" x2="170" y2="370" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 虚线箭头：模型→隐式梯度（共享权重） -->
  <line x1="310" y1="200" x2="420" y2="200" stroke="#999" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="365" y="190" text-anchor="middle" font-size="11" fill="#666">共享权重</text>

  <!-- 标注 -->
  <rect x="30" y="460" width="280" height="40" rx="6" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="170" y="478" text-anchor="middle" font-size="12" fill="#555">外循环（慢）：预训练阶段梯度下降</text>
  <text x="170" y="493" text-anchor="middle" font-size="11" fill="#888">学习语言知识、模式识别能力</text>

  <rect x="420" y="460" width="280" height="40" rx="6" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="560" y="478" text-anchor="middle" font-size="12" fill="#555">内循环（快）：推理阶段 Forward Pass</text>
  <text x="560" y="493" text-anchor="middle" font-size="11" fill="#888">从示例中学习新任务，无需反向传播</text>
</svg>