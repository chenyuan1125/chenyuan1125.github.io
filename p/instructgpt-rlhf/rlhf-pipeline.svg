<?xml version="1.0" encoding="UTF-8"?>
<svg width="576" height="760" viewBox="0 0 576 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rlhf-title rlhf-desc">
      <title id="rlhf-title">InstructGPT — RLHF Three-Step Pipeline</title>
      <desc id="rlhf-desc">Three sequential stages: Step 1 collects human demonstrations and trains an SFT model; Step 2 collects ranked model outputs and trains a reward model; Step 3 optimizes the policy with PPO against the reward model, with a KL penalty anchoring the policy to the SFT reference.</desc>

      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#707070"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <!-- Background -->
      <rect width="576" height="760" fill="#f5f5fa"/>

      <!-- ══ STEP 1 · SFT ══════════════════════════════════════════════ -->
      <text x="24" y="40" fill="#949ba5" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STEP 1 · SFT</text>

      <rect x="24" y="56" width="528" height="152" rx="6" fill="#ffffff" stroke="#c8ccd4" stroke-width="1"/>
      <text x="48" y="84" fill="#2c3e50" font-size="16" font-weight="600" font-family="'Geist', sans-serif">监督微调 Supervised Fine-Tuning</text>
      <text x="48" y="108" fill="#707070" font-size="12" font-family="'Geist', sans-serif">标注员针对 prompt 写高质量示范回答</text>
      <text x="48" y="130" fill="#707070" font-size="12" font-family="'Geist', sans-serif">~13k 条训练数据 · 16 epochs · cosine LR</text>
      <text x="48" y="152" fill="#707070" font-size="12" font-family="'Geist', sans-serif">1.3B / 6B / 175B 三个规模</text>
      <text x="48" y="182" fill="#949ba5" font-size="11" font-family="'Geist Mono', monospace">产出：SFT 模型 π_SFT（后续两步的起点）</text>

      <!-- Arrow: Step1 → Step2 -->
      <line x1="288" y1="208" x2="288" y2="236" stroke="#707070" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ══ STEP 2 · REWARD MODEL ═════════════════════════════════════ -->
      <text x="24" y="266" fill="#949ba5" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STEP 2 · REWARD MODEL</text>

      <rect x="24" y="282" width="528" height="152" rx="6" fill="#ffffff" stroke="#c8ccd4" stroke-width="1"/>
      <text x="48" y="310" fill="#2c3e50" font-size="16" font-weight="600" font-family="'Geist', sans-serif">训练奖励模型 r_θ(x, y)</text>
      <text x="48" y="334" fill="#707070" font-size="12" font-family="'Geist', sans-serif">每个 prompt 采样 K=4~9 个输出，标注员排序</text>
      <text x="48" y="356" fill="#707070" font-size="12" font-family="'Geist', sans-serif">排序转为 C(K,2) 成对比较 · ~33k prompts</text>
      <text x="48" y="378" fill="#707070" font-size="12" font-family="'Geist', sans-serif">RM 只用 6B（175B 训练不稳定）</text>
      <text x="48" y="408" fill="#949ba5" font-size="11" font-family="'Geist Mono', monospace">产出：给 (prompt, 回答) 打分的标量函数</text>

      <!-- Arrow: Step2 → Step3 -->
      <line x1="288" y1="434" x2="288" y2="462" stroke="#707070" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ══ STEP 3 · PPO (focal) ══════════════════════════════════════ -->
      <text x="24" y="492" fill="#2e5aa8" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STEP 3 · PPO</text>

      <rect x="24" y="508" width="528" height="176" rx="6" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.5"/>
      <text x="48" y="536" fill="#2c3e50" font-size="16" font-weight="600" font-family="'Geist', sans-serif">PPO 强化学习优化策略</text>
      <text x="48" y="560" fill="#707070" font-size="12" font-family="'Geist', sans-serif">目标：max E[r_θ(x,y)] − β·KL(π_φ ‖ π_SFT)</text>
      <text x="48" y="582" fill="#707070" font-size="12" font-family="'Geist', sans-serif">KL 惩罚 β=0.02，防止策略漂移破坏语言能力</text>
      <text x="48" y="604" fill="#707070" font-size="12" font-family="'Geist', sans-serif">batch 512 · minibatch 64 · 256k episodes</text>
      <text x="48" y="626" fill="#707070" font-size="12" font-family="'Geist', sans-serif">PPO-ptx：混入预训练梯度（γ=27.8）对齐税更低</text>
      <text x="48" y="656" fill="#949ba5" font-size="11" font-family="'Geist Mono', monospace">产出：InstructGPT（即 ChatGPT 的前身）</text>

      <!-- ══ KL anchor feedback path ═══════════════════════════════════ -->
      <path d="M 552 596 Q 574 596 574 578 Q 574 560 556 560 L 556 560"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3"/>
      <path d="M 40 596 Q 24 596 24 400 L 24 320 Q 24 300 40 298"
            fill="none" stroke="#707070" stroke-width="1.0" stroke-dasharray="4,3"/>

      <!-- ── Legend ─────────────────────────────────────────────────────── -->
      <line x1="24" y1="716" x2="552" y2="716" stroke="rgba(44,62,80,0.10)" stroke-width="0.8"/>
      <text x="24" y="742" fill="#707070" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">KL PENALTY</text>
      <line x1="140" y1="738" x2="160" y2="738" stroke="#707070" stroke-width="1.0" stroke-dasharray="4,3"/>
      <text x="168" y="742" fill="#707070" font-size="12" font-family="'Geist Mono', monospace">π_φ 不偏离 π_SFT — 保住语言能力</text>
    </svg>