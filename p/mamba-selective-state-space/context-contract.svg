<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="ctx-title ctx-desc">
  <title id="ctx-title">注意力与 Mamba 的上下文契约</title>
  <desc id="ctx-desc">注意力保存每个历史 token 的键值对，Mamba 将历史持续压缩成固定大小的状态。</desc>
  <defs>
    <marker id="ctx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52666b"/></marker>
    <filter id="ctx-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#27383c" flood-opacity=".12"/></filter>
  </defs>
  <rect width="600" height="420" rx="22" fill="#f4f0e8"/>
  <text x="300" y="35" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24363a">两种上下文契约</text>
  <rect x="22" y="58" width="270" height="330" rx="18" fill="#fcfaf5" stroke="#d6cfc1"/>
  <rect x="308" y="58" width="270" height="330" rx="18" fill="#e9f0ed" stroke="#b9cbc6"/>
  <text x="157" y="88" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#32484d">Attention：可回看的档案</text>
  <text x="443" y="88" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#244a43">Mamba：持续改写的状态</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#32484d">
    <g transform="translate(42 115)">
      <rect x="0" y="0" width="42" height="32" rx="7" fill="#dce5e4"/><text x="21" y="21" text-anchor="middle">x₁</text>
      <rect x="50" y="0" width="42" height="32" rx="7" fill="#dce5e4"/><text x="71" y="21" text-anchor="middle">x₂</text>
      <rect x="100" y="0" width="42" height="32" rx="7" fill="#dce5e4"/><text x="121" y="21" text-anchor="middle">x₃</text>
      <text x="157" y="21" font-size="17">…</text>
      <rect x="180" y="0" width="42" height="32" rx="7" fill="#edc77d"/><text x="201" y="21" text-anchor="middle">xₜ</text>
    </g>
    <path d="M63 154V182M113 154V182M163 154V182M243 154V182" stroke="#52666b" stroke-width="1.6" marker-end="url(#ctx-arrow)"/>
    <g filter="url(#ctx-shadow)">
      <rect x="41" y="184" width="232" height="102" rx="13" fill="#fff" stroke="#bac7c5"/>
      <text x="157" y="207" text-anchor="middle" font-weight="700">KV cache</text>
      <g fill="#dbe8e6" stroke="#8da6a1">
        <rect x="55" y="219" width="42" height="49" rx="6"/><rect x="105" y="219" width="42" height="49" rx="6"/><rect x="155" y="219" width="42" height="49" rx="6"/><rect x="217" y="219" width="42" height="49" rx="6"/>
      </g>
      <g text-anchor="middle"><text x="76" y="239">K₁</text><text x="76" y="258">V₁</text><text x="126" y="239">K₂</text><text x="126" y="258">V₂</text><text x="176" y="239">K₃</text><text x="176" y="258">V₃</text><text x="238" y="239">Kₜ</text><text x="238" y="258">Vₜ</text></g>
    </g>
    <path d="M157 288V319" stroke="#52666b" stroke-width="1.8" marker-end="url(#ctx-arrow)"/>
    <rect x="96" y="322" width="122" height="37" rx="9" fill="#314b50"/><text x="157" y="346" text-anchor="middle" fill="#fff">按当前问题检索</text>
    <text x="157" y="378" text-anchor="middle" fill="#7b6650">状态大小随 L 增长</text>
  </g>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#244a43">
    <g transform="translate(328 115)">
      <rect x="0" y="0" width="38" height="31" rx="7" fill="#fff"/><text x="19" y="20" text-anchor="middle">x₁</text>
      <rect x="47" y="0" width="38" height="31" rx="7" fill="#fff"/><text x="66" y="20" text-anchor="middle">x₂</text>
      <rect x="94" y="0" width="38" height="31" rx="7" fill="#fff"/><text x="113" y="20" text-anchor="middle">x₃</text>
      <text x="145" y="20" font-size="17">…</text>
      <rect x="176" y="0" width="38" height="31" rx="7" fill="#edc77d"/><text x="195" y="20" text-anchor="middle">xₜ</text>
    </g>
    <path d="M347 153C347 183 382 185 403 199M394 153C394 175 410 182 421 194M441 153V188M523 153C523 181 502 185 480 199" fill="none" stroke="#66827c" stroke-width="1.6" marker-end="url(#ctx-arrow)"/>
    <g filter="url(#ctx-shadow)">
      <path d="M390 205C390 181 410 166 443 166C476 166 496 181 496 205V263C496 287 476 302 443 302C410 302 390 287 390 263Z" fill="#2f665c"/>
      <ellipse cx="443" cy="205" rx="53" ry="26" fill="#4d8077"/>
      <path d="M403 236C421 222 449 222 483 238M403 262C426 248 456 250 483 265" fill="none" stroke="#a8cbc2" stroke-width="3" opacity=".75"/>
      <text x="443" y="210" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">hₜ</text>
      <text x="443" y="283" text-anchor="middle" fill="#eaf4f1">固定大小</text>
    </g>
    <path d="M443 305V326" stroke="#52666b" stroke-width="1.8" marker-end="url(#ctx-arrow)"/>
    <rect x="386" y="329" width="114" height="35" rx="9" fill="#244a43"/><text x="443" y="352" text-anchor="middle" fill="#fff">只保留当前状态</text>
    <text x="443" y="382" text-anchor="middle" fill="#426b63">状态大小与 L 无关</text>
  </g>
</svg>
