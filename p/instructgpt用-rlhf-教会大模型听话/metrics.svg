<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 576 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="metrics-title metrics-desc">
      <title id="metrics-title">InstructGPT vs GPT-3 — Key Metrics</title>
      <desc id="metrics-desc">Side-by-side comparison: human preference win rate, hallucination rate, and toxicity reduction between GPT-3 and InstructGPT.</desc>

      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><rect width="576" height="520" fill="#f5f5fa"/>

      <!-- ── Chart 1 · Win Rate ─────────────────────────────────────────── -->
      <text x="24" y="48" fill="#2c3e50" font-size="16" font-weight="600" font-family="'Geist', sans-serif">人类偏好胜率</text>
      <text x="24" y="68" fill="#707070" font-size="12" font-family="'Geist Mono', monospace">InstructGPT 175B vs GPT-3 175B</text>

      <!-- GPT-3 bar -->
      <rect x="24" y="88" width="0" height="24" rx="3" fill="#c8ccd4"/>
      <text x="32" y="106" fill="#707070" font-size="13" font-family="'Geist', sans-serif">GPT-3</text>
      <text x="32" y="122" fill="#2c3e50" font-size="20" font-weight="600" font-family="'Geist', sans-serif">15%</text>

      <!-- InstructGPT bar -->
      <rect x="180" y="88" width="375" height="24" rx="3" fill="#2e5aa8"/>
      <text x="188" y="106" fill="#ffffff" font-size="13" font-weight="600" font-family="'Geist', sans-serif">InstructGPT</text>
      <text x="188" y="122" fill="#2c3e50" font-size="20" font-weight="600" font-family="'Geist', sans-serif">85%</text>

      <!-- ── Chart 2 · Hallucination Rate ───────────────────────────────── -->
      <line x1="24" y1="160" x2="552" y2="160" stroke="rgba(44,62,80,0.10)" stroke-width="0.8"/>

      <text x="24" y="192" fill="#2c3e50" font-size="16" font-weight="600" font-family="'Geist', sans-serif">封闭域幻觉率</text>
      <text x="24" y="212" fill="#707070" font-size="12" font-family="'Geist Mono', monospace">TruthfulQA 上生成幻觉性封闭域答案的概率</text>

      <rect x="24" y="232" width="372" height="24" rx="3" fill="rgba(44,62,80,0.12)"/>
      <text x="32" y="250" fill="#2c3e50" font-size="13" font-family="'Geist', sans-serif">GPT-3</text>
      <text x="32" y="266" fill="#2c3e50" font-size="20" font-weight="600" font-family="'Geist', sans-serif">41%</text>

      <rect x="24" y="276" width="192" height="24" rx="3" fill="rgba(46,90,168,0.20)"/>
      <text x="32" y="294" fill="#2c3e50" font-size="13" font-family="'Geist', sans-serif">InstructGPT</text>
      <text x="32" y="310" fill="#2c3e50" font-size="20" font-weight="600" font-family="'Geist', sans-serif">21%</text>

      <!-- ── Chart 3 · Toxicity ─────────────────────────────────────────── -->
      <line x1="24" y1="340" x2="552" y2="340" stroke="rgba(44,62,80,0.10)" stroke-width="0.8"/>

      <text x="24" y="372" fill="#2c3e50" font-size="16" font-weight="600" font-family="'Geist', sans-serif">有害输出↓</text>
      <text x="24" y="392" fill="#707070" font-size="12" font-family="'Geist Mono', monospace">RealToxicityPrompts · prompted to be respectful</text>

      <rect x="24" y="412" width="464" height="24" rx="3" fill="rgba(44,62,80,0.12)"/>
      <text x="32" y="430" fill="#2c3e50" font-size="13" font-family="'Geist', sans-serif">GPT-3</text>
      <text x="32" y="446" fill="#2c3e50" font-size="20" font-weight="600" font-family="'Geist', sans-serif">基线</text>

      <rect x="24" y="452" width="348" height="24" rx="3" fill="rgba(46,90,168,0.20)"/>
      <text x="32" y="470" fill="#2c3e50" font-size="13" font-family="'Geist', sans-serif">InstructGPT</text>
      <text x="32" y="486" fill="#2c3e50" font-size="20" font-weight="600" font-family="'Geist', sans-serif">-25%</text>

      <!-- ── Arrow indicators ───────────────────────────────────────────── -->
      <text x="560" y="250" fill="#2e5aa8" font-size="28" font-family="'Geist', sans-serif">↓49%</text>
      <text x="384" y="470" fill="#2e5aa8" font-size="28" font-family="'Geist', sans-serif">↓25%</text>
    </svg>