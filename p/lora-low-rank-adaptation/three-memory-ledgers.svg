<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="ledger-title ledger-desc">
  <title id="ledger-title">三种微调方式的显存账本</title><desc id="ledger-desc">全量微调更新所有权重，LoRA 冻结底座并训练小适配器，QLoRA 进一步以四比特保存冻结底座。</desc>
  <defs><style>.t{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#18324a}.h{font-size:18px;font-weight:700}.m{font-size:14px}.s{font-size:12px;fill:#526677}</style></defs><rect width="600" height="420" rx="20" fill="#f7f3ea"/>
  <text x="28" y="38" class="t h">三种方法，削减的是不同账目</text>
  <g transform="translate(28 66)"><rect width="544" height="92" rx="14" fill="#fff" stroke="#c9d3da"/><text x="18" y="28" class="t h">全量微调</text><rect x="145" y="18" width="210" height="26" rx="6" fill="#18324a"/><text x="250" y="36" text-anchor="middle" fill="#fff" font-size="13" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">底座权重 · 全部更新</text><rect x="145" y="53" width="172" height="21" rx="5" fill="#ee765a"/><text x="231" y="68" text-anchor="middle" fill="#fff" font-size="12" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">全部梯度 + 优化器状态</text><text x="373" y="48" class="t m">每个任务一整份</text><text x="373" y="69" class="t s">存储与训练状态都大</text></g>
  <g transform="translate(28 174)"><rect width="544" height="92" rx="14" fill="#fff" stroke="#c9d3da"/><text x="18" y="28" class="t h">LoRA</text><rect x="145" y="18" width="210" height="26" rx="6" fill="#6f8291"/><text x="250" y="36" text-anchor="middle" fill="#fff" font-size="13" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">FP16/BF16 底座 · 冻结</text><rect x="145" y="53" width="54" height="21" rx="5" fill="#20a39e"/><text x="172" y="68" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">BA</text><text x="214" y="68" class="t s">梯度 + 优化器</text><text x="373" y="48" class="t m">任务只保存小增量</text><text x="373" y="69" class="t s">底座计算与激活仍存在</text></g>
  <g transform="translate(28 282)"><rect width="544" height="92" rx="14" fill="#fff" stroke="#c9d3da"/><text x="18" y="28" class="t h">QLoRA</text><rect x="145" y="18" width="104" height="26" rx="6" fill="#9aabb8"/><text x="197" y="36" text-anchor="middle" fill="#fff" font-size="13" font-family="Arial, sans-serif">4-bit base</text><rect x="145" y="53" width="54" height="21" rx="5" fill="#20a39e"/><text x="172" y="68" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">BA</text><text x="214" y="68" class="t s">较高精度训练</text><text x="373" y="48" class="t m">底座存储再压缩</text><text x="373" y="69" class="t s">计算时仍需反量化与激活</text></g>
  <text x="300" y="404" text-anchor="middle" class="t s">条块仅表达组成关系，不按实际显存比例绘制</text>
</svg>
