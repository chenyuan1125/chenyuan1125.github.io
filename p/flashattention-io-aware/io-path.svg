<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-labelledby="io-title io-desc">
  <title id="io-title">标准注意力与 FlashAttention 的数据路径</title>
  <desc id="io-desc">标准实现把分数和概率矩阵写入 HBM，FlashAttention 在 SRAM 中分块完成计算。</desc>
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b85b52"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#39788c"/></marker>
    <style>
      .t{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#24313a}.h{font-size:20px;font-weight:700}.sh{font-size:15px;font-weight:700}.b{font-size:13px}.sm{font-size:11px;fill:#5a6870}.box{fill:#fbfaf6;stroke:#c9d0cf;stroke-width:1.5}.hbm{fill:#d9e1e3;stroke:#687982;stroke-width:1.5}.sram{fill:#f2d49b;stroke:#9d6a22;stroke-width:1.5}.bad{fill:#f0cbc5;stroke:#b85b52}.good{fill:#cde3e8;stroke:#39788c}
    </style>
  </defs>
  <rect width="600" height="440" rx="18" fill="#f3f1ea"/>
  <text class="t h" x="300" y="34" text-anchor="middle">同一个精确 Attention，两条数据路径</text>
  <rect class="box" x="24" y="58" width="264" height="350" rx="14"/>
  <rect class="box" x="312" y="58" width="264" height="350" rx="14"/>
  <text class="t sh" x="156" y="86" text-anchor="middle">标准实现：完整中间矩阵落地</text>
  <text class="t sh" x="444" y="86" text-anchor="middle">FlashAttention：分块留在片上</text>

  <rect class="hbm" x="49" y="108" width="214" height="57" rx="8"/>
  <text class="t sh" x="156" y="133" text-anchor="middle">HBM：Q、K、V</text>
  <text class="t sm" x="156" y="151" text-anchor="middle">容量大 · 往返相对慢</text>
  <line x1="156" y1="165" x2="156" y2="194" stroke="#b85b52" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect class="bad" x="64" y="198" width="184" height="44" rx="7"/>
  <text class="t b" x="156" y="217" text-anchor="middle">写入 S = QKᵀ</text>
  <text class="t sm" x="156" y="234" text-anchor="middle">N × N</text>
  <line x1="156" y1="242" x2="156" y2="269" stroke="#b85b52" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect class="bad" x="64" y="273" width="184" height="44" rx="7"/>
  <text class="t b" x="156" y="292" text-anchor="middle">读 S，再写入 P = softmax(S)</text>
  <text class="t sm" x="156" y="309" text-anchor="middle">N × N</text>
  <line x1="156" y1="317" x2="156" y2="344" stroke="#b85b52" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect class="hbm" x="64" y="348" width="184" height="39" rx="7"/>
  <text class="t b" x="156" y="372" text-anchor="middle">读 P、V → 写 O</text>

  <rect class="hbm" x="337" y="108" width="214" height="57" rx="8"/>
  <text class="t sh" x="444" y="133" text-anchor="middle">HBM：Q、K、V 与最终 O</text>
  <text class="t sm" x="444" y="151" text-anchor="middle">不保存完整 S、P</text>
  <line x1="444" y1="165" x2="444" y2="200" stroke="#39788c" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect class="sram" x="342" y="204" width="204" height="105" rx="10"/>
  <text class="t sh" x="444" y="229" text-anchor="middle">片上 SRAM 小工作区</text>
  <g fill="#fff7e7" stroke="#9d6a22">
    <rect x="368" y="246" width="45" height="32" rx="4"/><rect x="422" y="246" width="45" height="32" rx="4"/><rect x="476" y="246" width="45" height="32" rx="4"/>
  </g>
  <text class="t sm" x="390" y="266" text-anchor="middle">Q 块</text><text class="t sm" x="444" y="266" text-anchor="middle">K/V 块</text><text class="t sm" x="498" y="266" text-anchor="middle">O 块</text>
  <text class="t sm" x="444" y="298" text-anchor="middle">matmul → mask → online softmax → matmul</text>
  <path d="M545 260 C568 260 568 335 529 335" fill="none" stroke="#39788c" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M342 260 C319 260 319 335 359 335" fill="none" stroke="#39788c" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect class="good" x="365" y="322" width="158" height="48" rx="8"/>
  <text class="t b" x="444" y="343" text-anchor="middle">局部分数用完即弃</text>
  <text class="t sm" x="444" y="360" text-anchor="middle">只带回 O 块与少量统计量</text>
  <text class="t sm" x="300" y="427" text-anchor="middle">关键差异：减少 HBM 读写，而不是近似注意力结果</text>
</svg>
