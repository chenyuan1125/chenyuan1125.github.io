<svg viewBox="0 0 600 360" width="600" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rope-cn-title rope-cn-desc">
  <title id="rope-cn-title">MLA 解耦 RoPE 的原因</title><desc id="rope-cn-desc">位置旋转若夹在投影中间会阻止矩阵吸收；MLA 把位置通道分离出来。</desc>
  <defs><marker id="a2cn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53636e"/></marker><style>.bg{fill:#f5f7f6}.card{fill:#fff;stroke:#cad3d6;stroke-width:1.5}.h{font:700 18px 'Microsoft YaHei',sans-serif;fill:#24343c}.t{font:14px 'Microsoft YaHei',sans-serif;fill:#43545c}.s{font:12px 'Microsoft YaHei',sans-serif;fill:#667982}.op{fill:#dbe8ea;stroke:#6d9099}.bad{fill:#eed5cc;stroke:#bd765b}.good{fill:#dce9d5;stroke:#6d9161}.line{stroke:#53636e;stroke-width:2;fill:none;marker-end:url(#a2cn)}</style></defs>
  <rect width="600" height="360" rx="20" class="bg"/><text x="28" y="38" class="h">为什么 RoPE 必须从压缩内容中“拆出来”</text>
  <rect x="24" y="58" width="552" height="112" rx="14" class="card"/><text x="42" y="84" class="t">直接把 RoPE 放进压缩后的 key</text>
  <rect x="44" y="105" width="72" height="38" rx="8" class="op"/><text x="80" y="129" text-anchor="middle" class="t">Q 投影</text><path d="M118 124H166" class="line"/><rect x="176" y="105" width="76" height="38" rx="8" class="bad"/><text x="214" y="129" text-anchor="middle" class="t">RoPEₜ</text><path d="M254 124H302" class="line"/><rect x="312" y="105" width="86" height="38" rx="8" class="op"/><text x="355" y="129" text-anchor="middle" class="t">Wᵁᴷ</text><path d="M400 124H438" class="line"/><text x="448" y="120" class="s">位置相关矩阵夹在中间</text><text x="448" y="140" class="s">无法预先合并</text>
  <rect x="24" y="188" width="552" height="144" rx="14" class="card"/><text x="42" y="214" class="t">解耦：内容通道可吸收，位置通道单独共享</text>
  <rect x="42" y="238" width="105" height="42" rx="8" class="good"/><text x="94" y="256" text-anchor="middle" class="t">内容注意力</text><text x="94" y="273" text-anchor="middle" class="s">QWᵁᴷ · cᴷⱽ</text><path d="M150 259H205" class="line"/><rect x="216" y="238" width="124" height="42" rx="8" class="good"/><text x="278" y="256" text-anchor="middle" class="t">吸收后的计算</text><text x="278" y="273" text-anchor="middle" class="s">不还原完整 K/V</text>
  <rect x="42" y="292" width="105" height="24" rx="7" class="bad"/><text x="94" y="309" text-anchor="middle" class="s">位置通道 qᴿ / kᴿ</text><path d="M150 304H205" class="line"/><text x="216" y="309" class="s">仅共享 kᴿ 进入缓存，保留相对位置信息</text>
</svg>
