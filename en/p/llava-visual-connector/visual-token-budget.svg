<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-labelledby="budget-en-title budget-en-desc">
  <title id="budget-en-title">The information and compute budget of visual tokens</title>
  <desc id="budget-en-desc">At patch size 14, increasing resolution from 224 to 672 raises visual tokens from 256 to 2304. The connector stays small while the attention matrix grows quickly.</desc>
  <defs><pattern id="p16-en" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M5 0H0V5" fill="none" stroke="#fff" stroke-width=".6"/></pattern><pattern id="p24-en" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M4 0H0V4" fill="none" stroke="#fff" stroke-width=".55"/></pattern><pattern id="p48-en" width="2" height="2" patternUnits="userSpaceOnUse"><path d="M2 0H0V2" fill="none" stroke="#fff" stroke-width=".35"/></pattern><style>.t{font-family:Arial,sans-serif;fill:#20333d}.h{font-size:18px;font-weight:700}.l{font-size:13px}.s{font-size:11px;fill:#607078}</style></defs>
  <rect width="600" height="430" rx="18" fill="#f6f1e7"/>
  <text x="28" y="38" class="t h">A small connector can feed a large visual sequence</text>
  <text x="28" y="61" class="t s">Square inputs with patch size = 14</text>
  <g transform="translate(42,92)"><rect width="80" height="80" rx="7" fill="#7ba6a1"/><rect width="80" height="80" rx="7" fill="url(#p16-en)"/><text x="40" y="104" text-anchor="middle" class="t l" font-weight="700">224px</text><text x="40" y="124" text-anchor="middle" class="t s">16×16 = 256</text></g>
  <g transform="translate(180,78)"><rect width="108" height="108" rx="7" fill="#4f7b83"/><rect width="108" height="108" rx="7" fill="url(#p24-en)"/><text x="54" y="132" text-anchor="middle" class="t l" font-weight="700">336px</text><text x="54" y="152" text-anchor="middle" class="t s">24×24 = 576</text></g>
  <g transform="translate(360,66)"><rect width="132" height="132" rx="7" fill="#274c5e"/><rect width="132" height="132" rx="7" fill="url(#p48-en)"/><text x="66" y="156" text-anchor="middle" class="t l" font-weight="700">672px</text><text x="66" y="176" text-anchor="middle" class="t s">48×48 = 2304</text></g>
  <rect x="28" y="270" width="544" height="99" rx="14" fill="#203d4d"/>
  <text x="48" y="299" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f6f1e7">Total length inside the language model</text>
  <text x="48" y="332" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#e5c36f">N = N<tspan baseline-shift="sub" font-size="15">text</tspan> + N<tspan baseline-shift="sub" font-size="15">vision</tspan></text>
  <text x="305" y="316" font-family="Arial,sans-serif" font-size="12" fill="#f6f1e7">attention matrix ≈ N²</text>
  <text x="305" y="341" font-family="Arial,sans-serif" font-size="12" fill="#f6f1e7">KV cache ≈ N</text>
  <rect x="28" y="390" width="10" height="10" rx="2" fill="#ef846f"/><text x="47" y="400" class="t s">2× image side → 4× patches; finer evidence is paid for with a longer sequence.</text>
</svg>
