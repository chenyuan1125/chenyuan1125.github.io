<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-labelledby="train-en-title train-en-desc">
  <title id="train-en-title">LLaVA two-stage training</title>
  <desc id="train-en-desc">Stage one freezes the vision encoder and language model and trains the connector. Stage two freezes the vision encoder and trains the connector and language model.</desc>
  <defs><marker id="a-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#48606c"/></marker><style>.t{font-family:Arial,sans-serif;fill:#20333d}.h{font-size:18px;font-weight:700}.l{font-size:13px}.s{font-size:11px;fill:#607078}.node{stroke:#38535f;stroke-width:1.4}.line{stroke:#48606c;stroke-width:2;marker-end:url(#a-en)}</style></defs>
  <rect width="600" height="430" rx="18" fill="#f6f1e7"/>
  <text x="28" y="38" class="t h">Two stages teach two different contracts</text>
  <rect x="28" y="72" width="544" height="132" rx="14" fill="#eaf0ec"/>
  <text x="46" y="98" class="t l" font-weight="700">Stage 1 · Feature alignment</text>
  <text x="46" y="118" class="t s">595K image-text pairs · make visual features readable by the LLM</text>
  <rect x="46" y="137" width="120" height="45" rx="9" fill="#cbd7d3" class="node"/><text x="106" y="158" text-anchor="middle" class="t l">vision encoder</text><text x="106" y="174" text-anchor="middle" class="t s">frozen</text>
  <line x1="172" y1="160" x2="213" y2="160" class="line"/>
  <rect x="221" y="137" width="120" height="45" rx="9" fill="#ef846f" class="node"/><text x="281" y="158" text-anchor="middle" class="t l">connector</text><text x="281" y="174" text-anchor="middle" class="t s">trained</text>
  <line x1="347" y1="160" x2="388" y2="160" class="line"/>
  <rect x="396" y="137" width="150" height="45" rx="9" fill="#cbd7d3" class="node"/><text x="471" y="158" text-anchor="middle" class="t l">language model</text><text x="471" y="174" text-anchor="middle" class="t s">frozen</text>
  <rect x="28" y="224" width="544" height="150" rx="14" fill="#fff6e4"/>
  <text x="46" y="250" class="t l" font-weight="700">Stage 2 · Visual instruction tuning</text>
  <text x="46" y="270" class="t s">158K conversation / description / reasoning samples · follow visual instructions</text>
  <rect x="46" y="292" width="120" height="50" rx="9" fill="#cbd7d3" class="node"/><text x="106" y="314" text-anchor="middle" class="t l">vision encoder</text><text x="106" y="332" text-anchor="middle" class="t s">still frozen</text>
  <line x1="172" y1="317" x2="213" y2="317" class="line"/>
  <rect x="221" y="292" width="120" height="50" rx="9" fill="#ef846f" class="node"/><text x="281" y="314" text-anchor="middle" class="t l">connector</text><text x="281" y="332" text-anchor="middle" class="t s">trained</text>
  <line x1="347" y1="317" x2="388" y2="317" class="line"/>
  <rect x="396" y="292" width="150" height="50" rx="9" fill="#e5c36f" class="node"/><text x="471" y="314" text-anchor="middle" class="t l">language model</text><text x="471" y="332" text-anchor="middle" class="t s">trained</text>
  <circle cx="36" cy="402" r="7" fill="#cbd7d3"/><text x="49" y="406" class="t s">frozen</text><circle cx="111" cy="402" r="7" fill="#ef846f"/><text x="124" y="406" class="t s">interface</text><circle cx="203" cy="402" r="7" fill="#e5c36f"/><text x="216" y="406" class="t s">behavior</text>
</svg>
