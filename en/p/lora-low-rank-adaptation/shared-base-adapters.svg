<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-labelledby="serve-title serve-desc">
  <title id="serve-title">Shared base with multiple LoRA adapters</title><desc id="serve-desc">A router selects one small adapter while requests share a base; one adapter can be merged, while concurrent adapters need dynamic scheduling.</desc>
  <defs><style>.t{font-family:Arial,sans-serif;fill:#18324a}.h{font-size:18px;font-weight:700}.m{font-size:14px}.s{font-size:12px;fill:#526677}.l{stroke:#294a66;stroke-width:2.3;fill:none}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#294a66"/></marker></defs><rect width="600" height="380" rx="20" fill="#f7f3ea"/>
  <text x="28" y="38" class="t h">Small adapters share a base—not the scheduler</text>
  <rect x="30" y="145" width="90" height="70" rx="13" fill="#fff" stroke="#294a66" stroke-width="2"/><text x="75" y="174" text-anchor="middle" class="t m">request</text><text x="75" y="196" text-anchor="middle" class="t s">task id</text><path d="M120 180H172" class="l" marker-end="url(#a)"/>
  <polygon points="178,142 232,180 178,218" fill="#ee765a"/><text x="190" y="185" fill="#fff" font-size="13" font-family="Arial, sans-serif">route</text>
  <path d="M232 180H267V100H305" class="l" marker-end="url(#a)"/><path d="M232 180H305" class="l" marker-end="url(#a)"/><path d="M232 180H267V260H305" class="l" marker-end="url(#a)"/>
  <rect x="311" y="69" width="100" height="60" rx="12" fill="#20a39e"/><text x="361" y="95" text-anchor="middle" fill="#fff" font-size="14" font-family="Arial, sans-serif">Writing</text><text x="361" y="115" text-anchor="middle" fill="#dff5f3" font-size="12" font-family="Arial, sans-serif">LoRA A</text>
  <rect x="311" y="150" width="100" height="60" rx="12" fill="#e6a64c"/><text x="361" y="176" text-anchor="middle" fill="#fff" font-size="14" font-family="Arial, sans-serif">Coding</text><text x="361" y="196" text-anchor="middle" fill="#fff5df" font-size="12" font-family="Arial, sans-serif">LoRA B</text>
  <rect x="311" y="231" width="100" height="60" rx="12" fill="#8b78ad"/><text x="361" y="257" text-anchor="middle" fill="#fff" font-size="14" font-family="Arial, sans-serif">Domain</text><text x="361" y="277" text-anchor="middle" fill="#f0eafd" font-size="12" font-family="Arial, sans-serif">LoRA C</text>
  <path d="M411 99H449M411 180H449M411 261H449" class="l"/><rect x="449" y="100" width="123" height="160" rx="16" fill="#18324a"/><text x="510" y="163" text-anchor="middle" fill="#fff" font-size="20" font-weight="700" font-family="Arial, sans-serif">Shared base</text><text x="510" y="190" text-anchor="middle" fill="#cfe0eb" font-size="13" font-family="Arial, sans-serif">frozen weights</text><text x="510" y="217" text-anchor="middle" fill="#cfe0eb" font-size="12" font-family="Arial, sans-serif">one base model</text>
  <rect x="52" y="316" width="220" height="38" rx="9" fill="#e6f3f2"/><text x="162" y="340" text-anchor="middle" class="t m">One adapter: merge into W</text><rect x="328" y="316" width="220" height="38" rx="9" fill="#fbe9e4"/><text x="438" y="340" text-anchor="middle" class="t m">Concurrent: routing + kernels remain</text>
</svg>
