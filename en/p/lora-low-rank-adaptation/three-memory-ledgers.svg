<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="ledger-title ledger-desc">
  <title id="ledger-title">Three fine-tuning memory ledgers</title><desc id="ledger-desc">Full fine-tuning updates every weight, LoRA trains small adapters beside a frozen base, and QLoRA also stores the base in four bits.</desc>
  <defs><style>.t{font-family:Arial,sans-serif;fill:#18324a}.h{font-size:18px;font-weight:700}.m{font-size:14px}.s{font-size:12px;fill:#526677}</style></defs><rect width="600" height="420" rx="20" fill="#f7f3ea"/>
  <text x="28" y="38" class="t h">Each method removes a different cost</text>
  <g transform="translate(28 66)"><rect width="544" height="92" rx="14" fill="#fff" stroke="#c9d3da"/><text x="18" y="28" class="t h">Full FT</text><rect x="145" y="18" width="210" height="26" rx="6" fill="#18324a"/><text x="250" y="36" text-anchor="middle" fill="#fff" font-size="13" font-family="Arial, sans-serif">base weights · all updated</text><rect x="145" y="53" width="172" height="21" rx="5" fill="#ee765a"/><text x="231" y="68" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">all gradients + optimizer</text><text x="373" y="48" class="t m">A full copy per task</text><text x="373" y="69" class="t s">Large state and storage</text></g>
  <g transform="translate(28 174)"><rect width="544" height="92" rx="14" fill="#fff" stroke="#c9d3da"/><text x="18" y="28" class="t h">LoRA</text><rect x="145" y="18" width="210" height="26" rx="6" fill="#6f8291"/><text x="250" y="36" text-anchor="middle" fill="#fff" font-size="13" font-family="Arial, sans-serif">FP16/BF16 base · frozen</text><rect x="145" y="53" width="54" height="21" rx="5" fill="#20a39e"/><text x="172" y="68" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">BA</text><text x="214" y="68" class="t s">gradients + optimizer</text><text x="373" y="48" class="t m">Save a small task delta</text><text x="373" y="69" class="t s">Base compute + activations remain</text></g>
  <g transform="translate(28 282)"><rect width="544" height="92" rx="14" fill="#fff" stroke="#c9d3da"/><text x="18" y="28" class="t h">QLoRA</text><rect x="145" y="18" width="104" height="26" rx="6" fill="#9aabb8"/><text x="197" y="36" text-anchor="middle" fill="#fff" font-size="13" font-family="Arial, sans-serif">4-bit base</text><rect x="145" y="53" width="54" height="21" rx="5" fill="#20a39e"/><text x="172" y="68" text-anchor="middle" fill="#fff" font-size="12" font-family="Arial, sans-serif">BA</text><text x="214" y="68" class="t s">trained at higher precision</text><text x="373" y="48" class="t m">Compress base storage too</text><text x="373" y="69" class="t s">Dequantize + keep activations</text></g>
  <text x="300" y="404" text-anchor="middle" class="t s">Blocks show composition, not literal memory proportions</text>
</svg>
