<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="trade-title trade-desc">
  <title id="trade-title">Three controls on speculative decoding speed</title><desc id="trade-desc">Higher acceptance improves gains, draft cost reduces them, and speculation length has an optimum determined by both.</desc>
  <defs><style>.bg{fill:#f7f3ea}.h{font:700 18px Arial,sans-serif;fill:#172f3d}.invh{font:700 18px Arial,sans-serif;fill:#fff}.t{font:14px Arial,sans-serif;fill:#39515d}.s{font:12px Arial,sans-serif;fill:#687a82}.card{fill:#fffdf8;stroke:#d8d2c6;stroke-width:1.5}.good{fill:#5d8f72}.warn{fill:#c96842}.navy{fill:#18394a}.axis{stroke:#829198;stroke-width:1.5}.curve{stroke:#2f7181;stroke-width:4;fill:none}</style></defs>
  <rect class="bg" width="600" height="420" rx="18"/><text class="h" x="30" y="38">Speed is not determined by draft accuracy alone</text>
  <g transform="translate(28 62)"><rect class="card" width="166" height="112" rx="14"/><circle class="good" cx="32" cy="32" r="17"/><text x="32" y="37" text-anchor="middle" class="invh">α</text><text class="h" x="58" y="36">Acceptance</text><text class="t" x="18" y="68">Higher means more</text><text class="t" x="18" y="90">draft tokens survive</text>
  <rect class="card" x="189" width="166" height="112" rx="14"/><circle class="warn" cx="221" cy="32" r="17"/><text x="221" y="37" text-anchor="middle" class="invh">c</text><text class="h" x="247" y="36">Draft cost</text><text class="t" x="207" y="68">A costly proposal can</text><text class="t" x="207" y="90">erase the benefit</text>
  <rect class="card" x="378" width="166" height="112" rx="14"/><circle class="navy" cx="410" cy="32" r="17"/><text x="410" y="37" text-anchor="middle" class="invh">γ</text><text class="h" x="436" y="36">Draft length</text><text class="t" x="396" y="68">Too short: idle lanes</text><text class="t" x="396" y="90">Too long: waste</text></g>
  <rect class="card" x="28" y="198" width="544" height="190" rx="14"/><text class="h" x="49" y="228">The best γ is a workload measurement</text><line class="axis" x1="74" y1="348" x2="526" y2="348"/><line class="axis" x1="74" y1="260" x2="74" y2="348"/><path class="curve" d="M78 338 C145 316,192 272,267 266 C346 259,381 281,438 314 C472 334,498 340,522 342"/><circle cx="276" cy="266" r="7" fill="#c96842"/><text class="t" x="291" y="270">optimum shifts with α, c, and batch</text><text class="s" x="68" y="373">short draft</text><text class="s" x="475" y="373">long draft</text><text class="s" x="37" y="305" transform="rotate(-90 37 305)">real speedup</text>
</svg>
