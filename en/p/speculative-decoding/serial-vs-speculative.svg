<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-labelledby="serial-title serial-desc">
  <title id="serial-title">Serial target calls in ordinary and speculative decoding</title>
  <desc id="serial-desc">Ordinary decoding runs the target four times for four tokens; speculative decoding drafts three tokens and verifies them in one target pass.</desc>
  <defs><style>.bg{fill:#f7f3ea}.panel{fill:#fffdf8;stroke:#d8d2c6;stroke-width:1.5}.h{font:700 18px Arial,sans-serif;fill:#172f3d}.t{font:14px Arial,sans-serif;fill:#39515d}.inv{font:14px Arial,sans-serif;fill:#fff}.s{font:12px Arial,sans-serif;fill:#657782}.target{fill:#18394a}.draft{fill:#c96842}.token{fill:#e9eee9;stroke:#a9b9b2}.ok{fill:#5d8f72}.arrow{stroke:#6c7f87;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6c7f87"/></marker></defs>
  <rect class="bg" width="600" height="420" rx="18"/><text class="h" x="32" y="36">Four tokens: how many expensive target rounds?</text>
  <rect class="panel" x="24" y="58" width="552" height="142" rx="14"/><text class="h" x="44" y="87">Ordinary autoregressive decoding</text><text class="t" x="44" y="111">Each target call confirms only the next position</text>
  <g transform="translate(50 133)"><rect class="target" width="86" height="40" rx="8"/><text x="43" y="25" text-anchor="middle" class="inv">Target</text><path class="arrow" d="M90 20 H118"/><rect class="token" x="125" y="2" width="42" height="36" rx="7"/><text class="t" x="146" y="25" text-anchor="middle">t₁</text><path class="arrow" d="M171 20 H198"/><rect class="target" x="205" width="40" height="40" rx="8"/><path class="arrow" d="M249 20 H276"/><rect class="token" x="283" y="2" width="42" height="36" rx="7"/><text class="t" x="304" y="25" text-anchor="middle">t₂</text><path class="arrow" d="M329 20 H356"/><rect class="target" x="363" width="40" height="40" rx="8"/><text class="t" x="425" y="25">… 4 rounds</text></g>
  <rect class="panel" x="24" y="218" width="552" height="176" rx="14"/><text class="h" x="44" y="247">Speculative decoding</text><text class="t" x="44" y="271">A cheap serial draft becomes parallel target scoring</text>
  <g transform="translate(52 294)"><rect class="draft" width="82" height="38" rx="8"/><text x="41" y="24" text-anchor="middle" class="inv">Drafter</text><path class="arrow" d="M86 19 H110"/><rect class="token" x="116" y="1" width="40" height="36" rx="7"/><text class="t" x="136" y="24" text-anchor="middle">t₁</text><rect class="token" x="164" y="1" width="40" height="36" rx="7"/><text class="t" x="184" y="24" text-anchor="middle">t₂</text><rect class="token" x="212" y="1" width="40" height="36" rx="7"/><text class="t" x="232" y="24" text-anchor="middle">t₃</text><path class="arrow" d="M258 19 H286"/><rect class="target" x="293" width="91" height="38" rx="8"/><text x="338" y="24" text-anchor="middle" class="inv">1 verify</text><path class="arrow" d="M388 19 H416"/><circle class="ok" cx="434" cy="19" r="16"/><path d="M426 19 l6 6 11-13" fill="none" stroke="white" stroke-width="3"/></g>
  <text class="s" x="52" y="361">The target still decides every token; only verification scheduling changes.</text>
</svg>
