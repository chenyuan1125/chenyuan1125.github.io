<svg width="640" height="460" viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t5map-title t5map-desc">
<title id="t5map-title">T5 — Everything Is Text-to-Text</title>
<desc id="t5map-desc">Four NLP tasks unified into the same format: input text with prefix to target text. Translation, classification, QA, and summarization all reformulated as text-to-text.</desc>
<defs>
  <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f0c29"/><stop offset="50%" stop-color="#302b63"/><stop offset="100%" stop-color="#24243e"/></linearGradient>
  <linearGradient id="out2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f093fb"/><stop offset="100%" stop-color="#f5576c"/></linearGradient>
  <marker id="arr2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a78bfa"/></marker>
</defs>
<rect width="640" height="460" fill="url(#bg2)" rx="12"/>
<text x="320" y="36" fill="#e9ecef" font-size="17" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">T5 · Unified Text-to-Text Framework</text>
<rect x="28" y="52" width="200" height="28" rx="6" fill="rgba(255,255,255,0.1)"/><text x="128" y="71" fill="#c4b5fd" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">TASK</text>
<rect x="236" y="52" width="220" height="28" rx="6" fill="rgba(255,255,255,0.1)"/><text x="346" y="71" fill="#c4b5fd" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">INPUT (prefix + text)</text>
<rect x="464" y="52" width="148" height="28" rx="6" fill="rgba(255,255,255,0.12)"/><text x="538" y="71" fill="#f9a8d4" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">TARGET OUTPUT</text>
<rect x="28" y="92" width="200" height="56" rx="6" fill="rgba(255,255,255,0.05)"/><text x="128" y="118" fill="#e9ecef" font-size="13" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Translation</text><text x="128" y="137" fill="#adb5bd" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">WMT English → German</text>
<rect x="236" y="92" width="220" height="56" rx="6" fill="rgba(255,255,255,0.05)"/><text x="346" y="118" fill="#adb5bd" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">translate English to German:</text><text x="346" y="138" fill="#e9ecef" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">That is good.</text>
<rect x="464" y="92" width="148" height="56" rx="6" fill="url(#out2)" opacity="0.85"/><text x="538" y="126" fill="#fff" font-size="15" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Das ist gut.</text>
<line x1="228" y1="120" x2="236" y2="120" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr2)"/>
<rect x="28" y="160" width="200" height="56" rx="6" fill="rgba(255,255,255,0.05)"/><text x="128" y="186" fill="#e9ecef" font-size="13" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Classification</text><text x="128" y="205" fill="#adb5bd" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">SST-2 Sentiment</text>
<rect x="236" y="160" width="220" height="56" rx="6" fill="rgba(255,255,255,0.05)"/><text x="346" y="186" fill="#adb5bd" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">sst2 sentence:</text><text x="346" y="206" fill="#e9ecef" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">This movie is great.</text>
<rect x="464" y="160" width="148" height="56" rx="6" fill="url(#out2)" opacity="0.85"/><text x="538" y="194" fill="#fff" font-size="15" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">positive</text>
<line x1="228" y1="188" x2="236" y2="188" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr2)"/>
<rect x="28" y="228" width="200" height="56" rx="6" fill="rgba(255,255,255,0.05)"/><text x="128" y="254" fill="#e9ecef" font-size="13" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Question Answering</text><text x="128" y="273" fill="#adb5bd" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">SQuAD</text>
<rect x="236" y="228" width="220" height="56" rx="6" fill="rgba(255,255,255,0.05)"/><text x="346" y="254" fill="#adb5bd" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">question: Where is Paris?</text><text x="346" y="274" fill="#e9ecef" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Paris is in France.</text>
<rect x="464" y="228" width="148" height="56" rx="6" fill="url(#out2)" opacity="0.85"/><text x="538" y="262" fill="#fff" font-size="15" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">France</text>
<line x1="228" y1="256" x2="236" y2="256" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr2)"/>
<rect x="28" y="296" width="200" height="56" rx="6" fill="rgba(255,255,255,0.05)"/><text x="128" y="322" fill="#e9ecef" font-size="13" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Summarization</text><text x="128" y="341" fill="#adb5bd" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">CNN / Daily Mail</text>
<rect x="236" y="296" width="220" height="56" rx="6" fill="rgba(255,255,255,0.05)"/><text x="346" y="323" fill="#adb5bd" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">summarize: [long article]</text>
<rect x="464" y="296" width="148" height="56" rx="6" fill="url(#out2)" opacity="0.85"/><text x="538" y="330" fill="#fff" font-size="15" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">summary text</text>
<line x1="228" y1="324" x2="236" y2="324" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr2)"/>
<rect x="28" y="380" width="584" height="48" rx="8" fill="rgba(255,255,255,0.06)"/>
<text x="320" y="401" fill="#a78bfa" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="500">One model. One loss function. One interface. Thousands of tasks.</text>
<text x="320" y="420" fill="#6c757d" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">No task-specific output layers — everything is text generation.</text>
</svg>
