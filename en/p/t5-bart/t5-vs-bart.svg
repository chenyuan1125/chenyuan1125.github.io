<svg viewBox="0 0 576 562" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t5-vs-bart-title t5-vs-bart-desc">
      <title id="t5-vs-bart-title">T5 vs BART — Pretraining Objectives</title>
      <desc id="t5-vs-bart-desc">Side-by-side comparison: T5 corrupts spans into sentinel tokens and predicts only the masked spans, while BART masks spans and shuffles sentences, then reconstructs the entire input.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#707070"/></marker>
      </defs>

      <rect width="576" height="562" fill="#f5f5fa"/>

      <text x="144" y="40" fill="#2c3e50" font-size="16" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">T5 · SPAN CORRUPTION</text>
      <text x="432" y="40" fill="#2c3e50" font-size="16" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BART · DENOISING</text>

      <line x1="144" y1="180" x2="144" y2="208" stroke="#707070" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="432" y1="180" x2="432" y2="208" stroke="#707070" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="144" y1="328" x2="144" y2="356" stroke="#707070" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="432" y1="328" x2="432" y2="356" stroke="#707070" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="12" y="64" width="264" height="116" rx="6" fill="#ffffff" stroke="#c8ccd4" stroke-width="1"/>
      <text x="144" y="92" fill="#949ba5" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">INPUT</text>
      <text x="144" y="130" fill="#2c3e50" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the cat sat on the mat</text>
      <text x="144" y="160" fill="#707070" font-size="16" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">original text</text>

      <rect x="300" y="64" width="264" height="116" rx="6" fill="#ffffff" stroke="#c8ccd4" stroke-width="1"/>
      <text x="432" y="92" fill="#949ba5" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">INPUT</text>
      <text x="432" y="130" fill="#2c3e50" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the cat sat on the mat</text>
      <text x="432" y="160" fill="#707070" font-size="16" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">original text</text>

      <rect x="12" y="212" width="264" height="116" rx="6" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.5"/>
      <text x="144" y="240" fill="#2e5aa8" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CORRUPTION</text>
      <text x="144" y="278" fill="#2c3e50" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the &lt;X&gt; sat &lt;Y&gt; the mat</text>
      <text x="144" y="308" fill="#707070" font-size="16" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">spans → sentinels</text>

      <rect x="300" y="212" width="264" height="116" rx="6" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.5"/>
      <text x="432" y="240" fill="#2e5aa8" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CORRUPTION</text>
      <text x="432" y="278" fill="#2c3e50" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the cat [MASK] the mat</text>
      <text x="432" y="308" fill="#707070" font-size="16" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">infilling + shuffle</text>

      <rect x="12" y="360" width="264" height="116" rx="6" fill="#ffffff" stroke="#c8ccd4" stroke-width="1"/>
      <text x="144" y="388" fill="#949ba5" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TARGET</text>
      <text x="144" y="426" fill="#2c3e50" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">→ &lt;X&gt; cat &lt;Y&gt; on</text>
      <text x="144" y="456" fill="#707070" font-size="16" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">predict spans only</text>

      <rect x="300" y="360" width="264" height="116" rx="6" fill="#ffffff" stroke="#c8ccd4" stroke-width="1"/>
      <text x="432" y="388" fill="#949ba5" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TARGET</text>
      <text x="432" y="426" fill="#2c3e50" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">→ the cat sat on the mat</text>
      <text x="432" y="456" fill="#707070" font-size="16" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reconstruct everything</text>

      <line x1="12" y1="500" x2="564" y2="500" stroke="rgba(44,62,80,0.12)" stroke-width="0.8"/>
      <text x="12" y="528" fill="#707070" font-size="16" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="514" width="20" height="16" rx="2" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.5"/>
      <text x="160" y="528" fill="#707070" font-size="16" font-family="'Geist Mono', ui-monospace, monospace">CORRUPTION — where they diverge</text>
      <line x1="128" y1="550" x2="146" y2="550" stroke="#707070" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="160" y="556" fill="#707070" font-size="16" font-family="'Geist Mono', ui-monospace, monospace">TRANSFORMATION</text>
</svg>
