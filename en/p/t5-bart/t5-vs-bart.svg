<svg width="640" height="540" viewBox="0 0 640 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vsb-title vsb-desc">
<title id="vsb-title">T5 vs BART — Corruption &amp; Target</title>
<desc id="vsb-desc">T5 replaces contiguous spans with sentinel tokens and predicts only the masked spans. BART masks tokens and shuffles sentences, then reconstructs the whole sequence.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1a2e"/><stop offset="100%" stop-color="#16213e"/></linearGradient>
  <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fdfbf7"/><stop offset="100%" stop-color="#f0ece3"/></linearGradient>
  <linearGradient id="boxT5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8f4f8"/><stop offset="100%" stop-color="#d1ecf1"/></linearGradient>
  <linearGradient id="boxBART" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8e8e8"/><stop offset="100%" stop-color="#f1d1d1"/></linearGradient>
  <linearGradient id="accentT5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d6efd"/><stop offset="100%" stop-color="#0a58ca"/></linearGradient>
  <linearGradient id="accentBART" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dc3545"/><stop offset="100%" stop-color="#b02a37"/></linearGradient>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#adb5bd"/></marker>
</defs>
<rect width="640" height="540" fill="url(#bg)" rx="12"/>
<text x="320" y="40" fill="#e9ecef" font-size="18" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="0.03em">T5 · SPAN CORRUPTION  vs  BART · DENOISING</text>
<rect x="32" y="60" width="276" height="32" rx="6" fill="url(#accentT5)"/><text x="170" y="81" fill="#fff" font-size="13" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">T5 — Predict masked spans only</text>
<rect x="332" y="60" width="276" height="32" rx="6" fill="url(#accentBART)"/><text x="470" y="81" fill="#fff" font-size="13" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">BART — Reconstruct everything</text>
<rect x="32" y="112" width="276" height="72" rx="8" fill="url(#box1)" stroke="#ced4da" stroke-width="1"/><text x="42" y="132" fill="#6c757d" font-size="10" font-weight="600" font-family="system-ui, sans-serif" letter-spacing="0.1em">INPUT</text><text x="170" y="160" fill="#212529" font-size="15" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">the cat sat on the mat</text><text x="170" y="177" fill="#6c757d" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">original sequence</text>
<rect x="332" y="112" width="276" height="72" rx="8" fill="url(#box1)" stroke="#ced4da" stroke-width="1"/><text x="342" y="132" fill="#6c757d" font-size="10" font-weight="600" font-family="system-ui, sans-serif" letter-spacing="0.1em">INPUT</text><text x="470" y="160" fill="#212529" font-size="15" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">the cat sat on the mat</text><text x="470" y="177" fill="#6c757d" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">original sequence</text>
<line x1="170" y1="184" x2="170" y2="200" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="470" y1="184" x2="470" y2="200" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="32" y="208" width="276" height="72" rx="8" fill="url(#boxT5)" stroke="#0d6efd" stroke-width="1.5"/><text x="42" y="228" fill="#0d6efd" font-size="10" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="0.1em">CORRUPTION</text><text x="170" y="256" fill="#212529" font-size="15" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">the &lt;X&gt; sat &lt;Y&gt; the mat</text><text x="170" y="273" fill="#6c757d" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">continuous spans → sentinel tokens</text>
<rect x="332" y="208" width="276" height="72" rx="8" fill="url(#boxBART)" stroke="#dc3545" stroke-width="1.5"/><text x="342" y="228" fill="#dc3545" font-size="10" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="0.1em">CORRUPTION</text><text x="470" y="256" fill="#212529" font-size="15" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">the cat [MASK] the mat</text><text x="470" y="273" fill="#6c757d" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">token infilling + sentence shuffle</text>
<line x1="170" y1="280" x2="170" y2="296" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="470" y1="280" x2="470" y2="296" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="32" y="304" width="276" height="72" rx="8" fill="url(#boxT5)" stroke="#0d6efd" stroke-width="1"/><text x="42" y="324" fill="#0d6efd" font-size="10" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="0.1em">TARGET</text><text x="170" y="352" fill="#212529" font-size="15" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">→ &lt;X&gt; cat &lt;Y&gt; on</text><text x="170" y="369" fill="#6c757d" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">predict only the masked spans</text>
<rect x="332" y="304" width="276" height="72" rx="8" fill="url(#boxBART)" stroke="#dc3545" stroke-width="1"/><text x="342" y="324" fill="#dc3545" font-size="10" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="0.1em">TARGET</text><text x="470" y="352" fill="#212529" font-size="15" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">→ the cat sat on the mat</text><text x="470" y="369" fill="#6c757d" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">reconstruct the full input</text>
<line x1="32" y1="408" x2="608" y2="408" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
<text x="32" y="432" fill="#adb5bd" font-size="11" font-weight="600" font-family="system-ui, sans-serif" letter-spacing="0.08em">LEGEND</text>
<rect x="120" y="422" width="12" height="12" rx="2" fill="url(#boxT5)" stroke="#0d6efd" stroke-width="1.5"/><text x="140" y="433" fill="#ced4da" font-size="12" font-family="system-ui, sans-serif">T5 · blue scheme</text>
<rect x="290" y="422" width="12" height="12" rx="2" fill="url(#boxBART)" stroke="#dc3545" stroke-width="1.5"/><text x="310" y="433" fill="#ced4da" font-size="12" font-family="system-ui, sans-serif">BART · red scheme</text>
<line x1="470" y1="428" x2="484" y2="428" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr)"/><text x="492" y="433" fill="#ced4da" font-size="12" font-family="system-ui, sans-serif">transformation</text>
<rect x="32" y="466" width="576" height="44" rx="8" fill="rgba(255,255,255,0.06)"/>
<text x="320" y="483" fill="#adb5bd" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Key difference: T5 predicts only the corrupted parts; BART reconstructs the whole input.</text>
<text x="320" y="500" fill="#6c757d" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">T5 is more compute-efficient; BART is more generation-friendly.</text>
</svg>
