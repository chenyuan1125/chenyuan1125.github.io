<svg viewBox="0 0 600 360" width="600" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rope-en-title rope-en-desc">
  <title id="rope-en-title">Why MLA decouples RoPE</title><desc id="rope-en-desc">A position-dependent rotation between projections prevents matrix absorption, so MLA separates positional channels.</desc>
  <defs><marker id="a2en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53636e"/></marker><style>.bg{fill:#f5f7f6}.card{fill:#fff;stroke:#cad3d6;stroke-width:1.5}.h{font:700 18px Arial,sans-serif;fill:#24343c}.t{font:14px Arial,sans-serif;fill:#43545c}.s{font:12px Arial,sans-serif;fill:#667982}.op{fill:#dbe8ea;stroke:#6d9099}.bad{fill:#eed5cc;stroke:#bd765b}.good{fill:#dce9d5;stroke:#6d9161}.line{stroke:#53636e;stroke-width:2;fill:none;marker-end:url(#a2en)}</style></defs>
  <rect width="600" height="360" rx="20" class="bg"/><text x="28" y="38" class="h">Why RoPE must leave the compressed content path</text>
  <rect x="24" y="58" width="552" height="112" rx="14" class="card"/><text x="42" y="84" class="t">If RoPE is applied inside the compressed key path</text>
  <rect x="44" y="105" width="72" height="38" rx="8" class="op"/><text x="80" y="129" text-anchor="middle" class="t">Q proj.</text><path d="M118 124H166" class="line"/><rect x="176" y="105" width="76" height="38" rx="8" class="bad"/><text x="214" y="129" text-anchor="middle" class="t">RoPEₜ</text><path d="M254 124H302" class="line"/><rect x="312" y="105" width="86" height="38" rx="8" class="op"/><text x="355" y="129" text-anchor="middle" class="t">Wᵁᴷ</text><path d="M400 124H438" class="line"/><text x="448" y="120" class="s">position matrix blocks</text><text x="448" y="140" class="s">pre-absorption</text>
  <rect x="24" y="188" width="552" height="144" rx="14" class="card"/><text x="42" y="214" class="t">Decouple: absorb content, share a separate positional key</text>
  <rect x="42" y="238" width="105" height="42" rx="8" class="good"/><text x="94" y="256" text-anchor="middle" class="t">content score</text><text x="94" y="273" text-anchor="middle" class="s">QWᵁᴷ · cᴷⱽ</text><path d="M150 259H205" class="line"/><rect x="216" y="238" width="124" height="42" rx="8" class="good"/><text x="278" y="256" text-anchor="middle" class="t">absorbed compute</text><text x="278" y="273" text-anchor="middle" class="s">no full K/V restore</text>
  <rect x="42" y="292" width="105" height="24" rx="7" class="bad"/><text x="94" y="309" text-anchor="middle" class="s">position qᴿ / kᴿ</text><path d="M150 304H205" class="line"/><text x="216" y="309" class="s">cache shared kᴿ only; retain relative position signal</text>
</svg>
