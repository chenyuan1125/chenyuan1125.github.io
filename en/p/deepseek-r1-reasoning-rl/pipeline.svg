<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4285f4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbc04;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#46bd7b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8e24aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ab47bc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">DeepSeek-R1 四阶段训练管线</text>

  <!-- Stage 1 -->
  <rect x="30" y="60" width="190" height="120" rx="12" fill="url(#g1)" filter="url(#shadow)"/>
  <text x="125" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="white">阶段一：冷启动</text>
  <text x="125" y="118" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">Cold Start SFT</text>
  <text x="125" y="140" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">数千条长 CoT 数据</text>
  <text x="125" y="157" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">微调 V3-Base</text>
  <text x="125" y="174" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">→ 稳定的 RL 起点</text>

  <!-- Arrow 1→2 -->
  <line x1="220" y1="120" x2="260" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="265" y="60" width="190" height="120" rx="12" fill="url(#g2)" filter="url(#shadow)"/>
  <text x="360" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="white">阶段二：推理 RL</text>
  <text x="360" y="118" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">Reasoning GRPO</text>
  <text x="360" y="140" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">数学 / 代码 / 科学</text>
  <text x="360" y="157" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">规则奖励 + 语言一致性</text>
  <text x="360" y="174" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">→ 推理能力强化</text>

  <!-- Arrow 2→3 -->
  <line x1="455" y1="120" x2="495" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="500" y="60" width="190" height="120" rx="12" fill="url(#g3)" filter="url(#shadow)"/>
  <text x="595" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="white">阶段三：SFT 扩展</text>
  <text x="595" y="118" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">Rejection Sampling + SFT</text>
  <text x="595" y="140" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">~600K 推理 + ~200K 通用</text>
  <text x="595" y="157" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">V3-Base 微调 2 epoch</text>
  <text x="595" y="174" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">→ 推理 + 通用能力</text>

  <!-- Arrow 3→4 -->
  <line x1="690" y1="120" x2="730" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="735" y="60" width="150" height="120" rx="12" fill="url(#g4)" filter="url(#shadow)"/>
  <text x="810" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="white">阶段四</text>
  <text x="810" y="115" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">全场景 RL</text>
  <text x="810" y="140" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">推理规则奖励</text>
  <text x="810" y="157" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">通用偏好对齐</text>
  <text x="810" y="174" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">→ 有用+无害</text>

  <!-- Bottom annotation -->
  <text x="450" y="220" text-anchor="middle" font-size="11" fill="#888">DeepSeek-V3-Base  →  冷启动 SFT  →  推理 RL  →  拒绝采样+SFT  →  全场景 RL  →  DeepSeek-R1</text>

  <!-- Data flow: 基座箭头 -->
  <rect x="30" y="250" width="855" height="55" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="45" y="272" font-size="11" font-weight="bold" fill="#555">数据流：</text>
  <text x="45" y="292" font-size="10" fill="#777">冷启动数据（几千条人工+自动生成的长 CoT）→ 推理 RL 自生成的轨迹 → 拒绝采样 600K + V3 通用 200K → 偏好对齐数据</text>

  <!-- Training details -->
  <rect x="30" y="320" width="855" height="55" rx="8" fill="#f0f7ff" stroke="#cce0ff" stroke-width="1"/>
  <text x="45" y="342" font-size="11" font-weight="bold" fill="#1a73e8">训练参数：</text>
  <text x="45" y="362" font-size="10" fill="#555">LR=3e-6 | KL β=0.001 | 采样温度 1.0 → 0.7 | G=16 | batch=512 | 阶段二 10,400步 | 阶段四 1,700步（最后400步引入偏好奖励）</text>
</svg>