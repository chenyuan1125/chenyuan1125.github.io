<svg width="640" height="820" viewBox="0 0 640 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rlhf-title rlhf-desc">
<title id="rlhf-title">InstructGPT — RLHF Three-Step Pipeline</title>
<desc id="rlhf-desc">Three sequential stages: Step 1 collects human demonstrations and trains an SFT model; Step 2 collects ranked model outputs and trains a reward model; Step 3 optimizes the policy with PPO against the reward model, with a KL penalty anchoring the policy to the SFT reference.</desc>
<defs>
  <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
  <linearGradient id="gstep" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f0f2f5"/></linearGradient>
  <linearGradient id="gppo" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e3f2fd"/><stop offset="100%" stop-color="#bbdefb"/></linearGradient>
  <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/></marker>
</defs>
<rect width="640" height="820" fill="url(#bg3)" rx="16"/>
<text x="320" y="42" fill="#e9ecef" font-size="20" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">RLHF: Aligning Language Models with Human Feedback</text>
<text x="320" y="66" fill="#8b949e" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">The three-step pipeline behind InstructGPT / ChatGPT</text>

<!-- STEP 1 -->
<rect x="32" y="90" width="576" height="190" rx="12" fill="url(#gstep)" stroke="#30363d" stroke-width="1"/>
<rect x="32" y="90" width="576" height="36" rx="12" fill="#238636" opacity="0.9"/><rect x="32" y="114" width="576" height="12" fill="#238636" opacity="0.9"/><text x="48" y="114" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">STEP 1 — Supervised Fine-Tuning (SFT)</text>
<text x="48" y="152" fill="#212529" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Collect human-written demonstrations</text>
<text x="48" y="174" fill="#57606a" font-size="12" font-family="system-ui, sans-serif">Prompt: "Explain RL to a non-technical person"</text>
<text x="48" y="192" fill="#57606a" font-size="12" font-family="system-ui, sans-serif">Labeler writes a high-quality response</text>
<rect x="48" y="214" width="220" height="28" rx="6" fill="#dafbe1" stroke="#2da44e" stroke-width="1"/>
<text x="158" y="233" fill="#1a7f37" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">→ Train GPT on ∼13K demonstration pairs</text>
<rect x="380" y="214" width="220" height="28" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
<text x="490" y="233" fill="#0969da" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Output: SFT model π_SFT</text>

<line x1="320" y1="280" x2="320" y2="310" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr3)"/>

<!-- STEP 2 -->
<rect x="32" y="320" width="576" height="190" rx="12" fill="url(#gstep)" stroke="#30363d" stroke-width="1"/>
<rect x="32" y="320" width="576" height="36" rx="12" fill="#9e6a03" opacity="0.9"/><rect x="32" y="344" width="576" height="12" fill="#9e6a03" opacity="0.9"/><text x="48" y="344" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">STEP 2 — Reward Model Training</text>
<text x="48" y="382" fill="#212529" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Train a reward model rθ(x, y) on human preferences</text>
<text x="48" y="404" fill="#57606a" font-size="12" font-family="system-ui, sans-serif">For each prompt, generate K=4–9 outputs, labeler ranks them</text>
<text x="48" y="422" fill="#57606a" font-size="12" font-family="system-ui, sans-serif">Convert rankings to C(K,2) pairwise comparisons</text>
<rect x="48" y="444" width="220" height="28" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
<text x="158" y="463" fill="#0969da" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">∼33K prompts · 6B model only</text>
<rect x="380" y="444" width="220" height="28" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
<text x="490" y="463" fill="#0969da" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Output: reward model rθ</text>

<line x1="320" y1="510" x2="320" y2="540" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr3)"/>

<!-- STEP 3 -->
<rect x="32" y="550" width="576" height="210" rx="12" fill="url(#gppo)" stroke="#0969da" stroke-width="2"/>
<rect x="32" y="550" width="576" height="36" rx="12" fill="#0969da"/><rect x="32" y="574" width="576" height="12" fill="#0969da"/><text x="48" y="574" fill="#fff" font-size="13" font-weight="700" font-family="system-ui, sans-serif">STEP 3 — PPO Reinforcement Learning ✨ (focus)</text>
<text x="48" y="612" fill="#212529" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Optimize policy with PPO against the reward model</text>
<text x="48" y="634" fill="#57606a" font-size="12" font-family="system-ui, sans-serif">max E[rθ(x,y)] − β·KL(π_φ ‖ π_SFT)</text>
<text x="48" y="654" fill="#57606a" font-size="12" font-family="system-ui, sans-serif">KL penalty β=0.02 prevents policy drift</text>
<rect x="48" y="676" width="240" height="28" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
<text x="168" y="695" fill="#0969da" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Batch 512 · Minibatch 64 · 256K episodes</text>
<rect x="340" y="676" width="260" height="28" rx="6" fill="#fff3cd" stroke="#bf8700" stroke-width="1"/>
<text x="470" y="695" fill="#9a6700" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">PPO-ptx: mixed pretraining gradient</text>

<rect x="32" y="730" width="576" height="28" rx="8" fill="#dafbe1" stroke="#2da44e" stroke-width="1"/>
<text x="320" y="749" fill="#1a7f37" font-size="13" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">✨ Result: InstructGPT outperforms GPT-3 on human eval with 100× fewer parameters</text>
</svg>
