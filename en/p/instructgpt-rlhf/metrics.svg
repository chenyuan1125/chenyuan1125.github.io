<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="metrics-title metrics-desc">
<title id="metrics-title">InstructGPT — Key Results</title>
<desc id="metrics-desc">Key quantitative results from the InstructGPT paper: hallucination rate 41% to 21%, GPT-3 175B win rate comparison, alignment tax trade-off, and truthfulness improvements.</desc>
<defs>
  <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
  <linearGradient id="gpt3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#30363d"/><stop offset="100%" stop-color="#21262d"/></linearGradient>
  <linearGradient id="instr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#238636"/><stop offset="100%" stop-color="#1a7f37"/></linearGradient>
  <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#1f6feb"/></linearGradient>
  <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f0883e"/><stop offset="100%" stop-color="#db6d28"/></linearGradient>
</defs>
<rect width="640" height="420" fill="url(#bg4)" rx="12"/>
<text x="320" y="36" fill="#e9ecef" font-size="18" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">InstructGPT: Key Quantitative Results</text>

<!-- Metric 1: Hallucination -->
<text x="40" y="82" fill="#e9ecef" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Closed-domain hallucination rate</text>
<text x="40" y="100" fill="#8b949e" font-size="11" font-family="system-ui, sans-serif">(lower is better)</text>
<rect x="40" y="112" width="380" height="24" rx="4" fill="url(#gpt3)"/>
<rect x="40" y="112" width="246" height="24" rx="4" fill="url(#bar2)"/>
<text x="430" y="129" fill="#f0883e" font-size="13" font-weight="600" font-family="system-ui, sans-serif">GPT-3: 41%</text>
<rect x="40" y="144" width="380" height="24" rx="4" fill="url(#gpt3)"/>
<rect x="40" y="144" width="126" height="24" rx="4" fill="url(#bar1)"/>
<text x="430" y="161" fill="#58a6ff" font-size="13" font-weight="600" font-family="system-ui, sans-serif">InstructGPT: 21%</text>

<!-- Metric 2: Human eval -->
<text x="40" y="212" fill="#e9ecef" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Human evaluation win rate vs. GPT-3 175B</text>
<text x="40" y="230" fill="#8b949e" font-size="11" font-family="system-ui, sans-serif">(higher is better)</text>
<rect x="40" y="242" width="380" height="24" rx="4" fill="url(#gpt3)"/>
<rect x="40" y="242" width="210" height="24" rx="4" fill="url(#instr)"/>
<text x="430" y="259" fill="#3fb950" font-size="13" font-weight="600" font-family="system-ui, sans-serif">InstructGPT 1.3B: ~55%</text>
<rect x="40" y="274" width="380" height="24" rx="4" fill="url(#gpt3)"/>
<rect x="40" y="274" width="320" height="24" rx="4" fill="url(#instr)"/>
<text x="430" y="291" fill="#3fb950" font-size="13" font-weight="600" font-family="system-ui, sans-serif">InstructGPT 175B: ~85%</text>

<!-- Metric 3: Truthfulness -->
<text x="40" y="338" fill="#e9ecef" font-size="13" font-weight="600" font-family="system-ui, sans-serif">TruthfulQA accuracy improvement</text>
<rect x="40" y="352" width="380" height="24" rx="4" fill="url(#gpt3)"/>
<rect x="40" y="352" width="48" height="24" rx="4" fill="url(#bar2)"/>
<text x="430" y="369" fill="#f0883e" font-size="13" font-weight="600" font-family="system-ui, sans-serif">GPT-3: ~12%</text>
<rect x="40" y="384" width="380" height="24" rx="4" fill="url(#gpt3)"/>
<rect x="40" y="384" width="104" height="24" rx="4" fill="url(#bar1)"/>
<text x="430" y="401" fill="#58a6ff" font-size="13" font-weight="600" font-family="system-ui, sans-serif">InstructGPT: ~25%</text>
</svg>
