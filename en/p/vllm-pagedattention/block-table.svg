<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" width="600" height="410" role="img" aria-labelledby="bt-title bt-desc">
  <title id="bt-title">Logical-to-physical block mapping in PagedAttention</title><desc id="bt-desc">Logical blocks remain ordered while a block table maps them to non-contiguous physical blocks and appends a mapping on demand.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#496879"/></marker></defs>
  <rect width="600" height="410" rx="20" fill="#f7f4ee"/>
  <text x="30" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#18324b">Order is logical; location is a mapping</text>
  <text x="30" y="83" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#405565">LOGICAL TOKEN STREAM</text>
  <g stroke="#f7f4ee" stroke-width="3" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle"><rect x="30" y="98" width="100" height="54" rx="9" fill="#3b7896"/><text x="80" y="130">Logical 0</text><rect x="140" y="98" width="100" height="54" rx="9" fill="#4a938a"/><text x="190" y="130">Logical 1</text><rect x="250" y="98" width="100" height="54" rx="9" fill="#cf735d"/><text x="300" y="130">Logical 2</text><rect x="360" y="98" width="100" height="54" rx="9" fill="#f0e1c6" stroke="#c9a66a" stroke-dasharray="6 4"/><text x="410" y="122" fill="#7a5d34">Allocate only</text><text x="410" y="140" fill="#7a5d34">when full</text></g>
  <rect x="55" y="190" width="400" height="72" rx="12" fill="#e6ebee"/>
  <text x="72" y="215" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#29465d">BLOCK TABLE</text><g font-family="Consolas, monospace" font-size="14" fill="#29465d"><text x="76" y="241">logical   0       1       2</text><text x="76" y="257">physical  7       1       3</text></g>
  <g stroke="#496879" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M80 153 C80 188, 520 184, 520 298"/><path d="M190 153 C190 205, 175 236, 175 298"/><path d="M300 153 C300 205, 360 236, 360 298"/></g>
  <text x="30" y="306" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#405565">GPU PHYSICAL BLOCK POOL</text>
  <g font-family="Consolas, monospace" font-size="14" text-anchor="middle"><rect x="30" y="322" width="62" height="48" rx="8" fill="#d7dede"/><text x="61" y="352" fill="#617078">0</text><rect x="102" y="322" width="62" height="48" rx="8" fill="#4a938a"/><text x="133" y="352" fill="white">1</text><rect x="174" y="322" width="62" height="48" rx="8" fill="#d7dede"/><text x="205" y="352" fill="#617078">2</text><rect x="246" y="322" width="62" height="48" rx="8" fill="#cf735d"/><text x="277" y="352" fill="white">3</text><rect x="318" y="322" width="62" height="48" rx="8" fill="#d7dede"/><text x="349" y="352" fill="#617078">4</text><rect x="390" y="322" width="62" height="48" rx="8" fill="#d7dede"/><text x="421" y="352" fill="#617078">5</text><rect x="462" y="322" width="62" height="48" rx="8" fill="#d7dede"/><text x="493" y="352" fill="#617078">6</text><rect x="534" y="322" width="42" height="48" rx="8" fill="#3b7896"/><text x="555" y="352" fill="white">7</text></g>
  <text x="30" y="394" font-family="Arial, sans-serif" font-size="12" fill="#66747b">Logical 0 → physical 7 · logical 1 → physical 1 · logical 2 → physical 3</text>
</svg>
