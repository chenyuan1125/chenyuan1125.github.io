<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-labelledby="softmax-title softmax-desc">
  <title id="softmax-title">Tiled online softmax</title>
  <desc id="softmax-desc">Three tiles update a maximum, exponential sum, and output accumulator before producing exact attention.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#497f8e"/></marker><style>.t{font-family:Arial,sans-serif;fill:#25323a}.h{font-size:20px;font-weight:700}.sh{font-size:14px;font-weight:700}.b{font-size:11.5px}.sm{font-size:10px;fill:#627078}.tile{stroke:#657b84;stroke-width:1.2}.state{fill:#fffaf0;stroke:#b0782f;stroke-width:1.4}.out{fill:#cfe3e4;stroke:#497f8e;stroke-width:1.5}</style></defs>
  <rect width="600" height="430" rx="18" fill="#f4f2eb"/><text class="t h" x="300" y="34" text-anchor="middle">Softmax Does Not Need the Whole Row at Once</text><text class="t sm" x="300" y="55" text-anchor="middle">Each score tile updates only three row-wise statistics</text>
  <g transform="translate(34 84)"><text class="t sh" x="70" y="0" text-anchor="middle">Tile 1</text><g class="tile"><rect x="18" y="16" width="26" height="26" fill="#88aeb9"/><rect x="46" y="16" width="26" height="26" fill="#b9ccd1"/><rect x="74" y="16" width="26" height="26" fill="#6f99a6"/><rect x="102" y="16" width="26" height="26" fill="#d7e2e3"/></g><text class="t sm" x="73" y="60" text-anchor="middle">local QKᵀ scores</text><rect class="state" x="7" y="79" width="132" height="104" rx="9"/><text class="t b" x="73" y="103" text-anchor="middle">m₁ = tile maximum</text><text class="t b" x="73" y="128" text-anchor="middle">ℓ₁ = exponential sum</text><text class="t b" x="73" y="153" text-anchor="middle">o₁ = weighted V sum</text><text class="t sm" x="73" y="173" text-anchor="middle">not normalized yet</text></g>
  <line x1="176" y1="180" x2="212" y2="180" stroke="#497f8e" stroke-width="2.5" marker-end="url(#a)"/>
  <g transform="translate(218 84)"><text class="t sh" x="70" y="0" text-anchor="middle">Tile 2</text><g class="tile"><rect x="18" y="16" width="26" height="26" fill="#bd8a48"/><rect x="46" y="16" width="26" height="26" fill="#e0be88"/><rect x="74" y="16" width="26" height="26" fill="#9e6d30"/><rect x="102" y="16" width="26" height="26" fill="#f0d9b5"/></g><text class="t sm" x="73" y="60" text-anchor="middle">new local scores</text><rect class="state" x="0" y="79" width="146" height="104" rx="9"/><text class="t b" x="73" y="102" text-anchor="middle">m₂ = max(m₁, tile max)</text><text class="t b" x="73" y="127" text-anchor="middle">rescale old ℓ by eᵐ¹⁻ᵐ²</text><text class="t b" x="73" y="152" text-anchor="middle">rescale old o, then add tile</text><text class="t sm" x="73" y="173" text-anchor="middle">stable merge</text></g>
  <line x1="370" y1="180" x2="406" y2="180" stroke="#497f8e" stroke-width="2.5" marker-end="url(#a)"/>
  <g transform="translate(412 84)"><text class="t sh" x="70" y="0" text-anchor="middle">Tile 3 and onward</text><g class="tile"><rect x="18" y="16" width="26" height="26" fill="#8c9b76"/><rect x="46" y="16" width="26" height="26" fill="#c2ccb1"/><rect x="74" y="16" width="26" height="26" fill="#71855a"/><rect x="102" y="16" width="26" height="26" fill="#dde3d4"/></g><text class="t sm" x="73" y="60" text-anchor="middle">repeat the update</text><rect class="state" x="7" y="79" width="132" height="104" rx="9"/><text class="t b" x="73" y="103" text-anchor="middle">maintain m, ℓ, o</text><text class="t b" x="73" y="130" text-anchor="middle">discard score tile</text><text class="t b" x="73" y="157" text-anchor="middle">never store a full row</text></g>
  <line x1="485" y1="270" x2="485" y2="311" stroke="#497f8e" stroke-width="2.5" marker-end="url(#a)"/><rect class="out" x="345" y="315" width="240" height="76" rx="12"/><text class="t sh" x="465" y="341" text-anchor="middle">Final O = o / ℓ</text><text class="t b" x="465" y="365" text-anchor="middle">equivalent to full stable softmax</text><text class="t sm" x="465" y="382" text-anchor="middle">apart from normal floating-point rounding</text>
  <rect x="29" y="315" width="270" height="76" rx="12" fill="#e7e3d9" stroke="#a7aaa8"/><text class="t sh" x="164" y="341" text-anchor="middle">Only sufficient statistics stay on chip</text><text class="t b" x="164" y="365" text-anchor="middle">one max m and one sum ℓ per row</text><text class="t b" x="164" y="383" text-anchor="middle">plus a d-dimensional accumulator o</text><text class="t sm" x="300" y="418" text-anchor="middle">Tiling changes execution order, not dense-attention semantics.</text>
</svg>
