<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t5-vs-bart-title t5-vs-bart-desc">
      <title id="t5-vs-bart-title">T5 vs BART — Pretraining Objectives</title>
      <desc id="t5-vs-bart-desc">Two-zone comparison: T5 corrupts spans into sentinel tokens and predicts only the masked spans, while BART masks spans and shuffles sentences, then reconstructs the entire input.</desc>

      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#707070"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <!-- Background -->
      <rect width="1120" height="580" fill="#f5f5fa"/>

      <!-- ── Zones (drawn before arrows and nodes) ─────────────────────── -->
      <rect x="24" y="96" width="1072" height="176" rx="8" fill="rgba(44,62,80,0.02)" stroke="rgba(44,62,80,0.10)" stroke-width="0.8"/>
      <rect x="40" y="100" width="200" height="12" rx="2" fill="#f5f5fa"/>
      <text x="44" y="109" fill="rgba(44,62,80,0.40)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">T5 · SPAN CORRUPTION</text>

      <rect x="24" y="304" width="1072" height="176" rx="8" fill="rgba(44,62,80,0.02)" stroke="rgba(44,62,80,0.10)" stroke-width="0.8"/>
      <rect x="40" y="308" width="236" height="12" rx="2" fill="#f5f5fa"/>
      <text x="44" y="317" fill="rgba(44,62,80,0.40)" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BART · DENOISING RECONSTRUCTION</text>

      <!-- ── Column headers ─────────────────────────────────────────────── -->
      <rect x="188" y="28" width="24" height="16" rx="2" fill="rgba(44,62,80,0.12)"/>
      <text x="200" y="40" fill="#2c3e50" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">01</text>
      <text x="200" y="60" fill="#707070" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">INPUT</text>

      <rect x="548" y="28" width="24" height="16" rx="2" fill="rgba(46,90,168,0.20)"/>
      <text x="560" y="40" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">02</text>
      <text x="560" y="60" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CORRUPTION</text>

      <rect x="908" y="28" width="24" height="16" rx="2" fill="rgba(44,62,80,0.12)"/>
      <text x="920" y="40" fill="#2c3e50" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">03</text>
      <text x="920" y="60" fill="#707070" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">TARGET</text>

      <!-- ── Arrows (drawn before node rects) ───────────────────────────── -->
      <line x1="360" y1="194" x2="396" y2="194" stroke="#707070" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="720" y1="194" x2="756" y2="194" stroke="#707070" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="360" y1="402" x2="396" y2="402" stroke="#707070" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="720" y1="402" x2="756" y2="402" stroke="#707070" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ── T5 lane nodes ──────────────────────────────────────────────── -->
      <!-- Input -->
      <rect x="40" y="144" width="320" height="100" rx="6" fill="#f5f5fa"/>
      <rect x="40" y="144" width="320" height="100" rx="6" fill="#ffffff" stroke="#c8ccd4" stroke-width="1"/>
      <text x="200" y="188" fill="#2c3e50" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the cat sat on the mat</text>
      <text x="200" y="210" fill="#707070" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">original text</text>

      <!-- Corruption — FOCAL -->
      <rect x="400" y="144" width="320" height="100" rx="6" fill="#f5f5fa"/>
      <rect x="400" y="144" width="320" height="100" rx="6" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="560" y="188" fill="#2c3e50" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the &lt;X&gt; sat &lt;Y&gt; the mat</text>
      <text x="560" y="210" fill="#707070" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">spans → sentinel tokens</text>

      <!-- Target -->
      <rect x="760" y="144" width="320" height="100" rx="6" fill="#f5f5fa"/>
      <rect x="760" y="144" width="320" height="100" rx="6" fill="#ffffff" stroke="#c8ccd4" stroke-width="1"/>
      <text x="920" y="188" fill="#2c3e50" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">→ &lt;X&gt; cat &lt;Y&gt; on</text>
      <text x="920" y="210" fill="#707070" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">predict masked spans only</text>

      <!-- ── BART lane nodes ────────────────────────────────────────────── -->
      <!-- Input -->
      <rect x="40" y="352" width="320" height="100" rx="6" fill="#f5f5fa"/>
      <rect x="40" y="352" width="320" height="100" rx="6" fill="#ffffff" stroke="#c8ccd4" stroke-width="1"/>
      <text x="200" y="396" fill="#2c3e50" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the cat sat on the mat</text>
      <text x="200" y="418" fill="#707070" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">original text</text>

      <!-- Corruption — FOCAL -->
      <rect x="400" y="352" width="320" height="100" rx="6" fill="#f5f5fa"/>
      <rect x="400" y="352" width="320" height="100" rx="6" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="560" y="396" fill="#2c3e50" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the cat [MASK] the mat</text>
      <text x="560" y="418" fill="#707070" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">infilling + sentence shuffle</text>

      <!-- Target -->
      <rect x="760" y="352" width="320" height="100" rx="6" fill="#f5f5fa"/>
      <rect x="760" y="352" width="320" height="100" rx="6" fill="#ffffff" stroke="#c8ccd4" stroke-width="1"/>
      <text x="920" y="396" fill="#2c3e50" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">→ the cat sat on the mat</text>
      <text x="920" y="418" fill="#707070" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reconstruct the full input</text>

      <!-- ── Legend ─────────────────────────────────────────────────────── -->
      <line x1="24" y1="512" x2="1096" y2="512" stroke="rgba(44,62,80,0.10)" stroke-width="0.8"/>
      <text x="24" y="532" fill="#707070" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="112" y="522" width="16" height="12" rx="2" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="136" y="532" fill="#707070" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CORRUPTION — where the two objectives diverge</text>

      <line x1="112" y1="552" x2="124" y2="552" stroke="#707070" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="136" y="555" fill="#707070" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">TRANSFORMATION</text>
    </svg>
