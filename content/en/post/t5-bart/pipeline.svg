<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, sans-serif">
  <rect width="800" height="400" fill="#fafafa"/>
  
  <!-- T5 部分 -->
  <text x="200" y="35" font-size="18" font-weight="600" fill="#1a1a1a" text-anchor="middle">T5: Span Corruption</text>
  
  <rect x="40" y="60" width="320" height="40" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="200" y="85" font-size="13" fill="#0d47a1" text-anchor="middle">The quick brown fox jumps over the lazy dog</text>
  
  <path d="M200 100 L200 130" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="40" y="130" width="320" height="40" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="200" y="155" font-size="13" fill="#e65100" text-anchor="middle">The &lt;X&gt; fox jumps &lt;Y&gt; dog</text>
  
  <path d="M200 170 L200 200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="40" y="200" width="320" height="40" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="200" y="225" font-size="13" fill="#1b5e20" text-anchor="middle">→ &lt;X&gt; quick brown &lt;Y&gt; over the lazy</text>
  
  <text x="200" y="270" font-size="12" fill="#666" text-anchor="middle">只预测被遮蔽的片段（高效）</text>
  
  <!-- BART 部分 -->
  <text x="600" y="35" font-size="18" font-weight="600" fill="#1a1a1a" text-anchor="middle">BART: Denoising Reconstruction</text>
  
  <rect x="440" y="60" width="320" height="40" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="600" y="85" font-size="13" fill="#0d47a1" text-anchor="middle">The quick brown fox jumps over the lazy dog</text>
  
  <path d="M600 100 L600 130" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="440" y="130" width="320" height="40" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="600" y="155" font-size="13" fill="#e65100" text-anchor="middle">[MASK] fox jumps [MASK] dog（打乱句子）</text>
  
  <path d="M600 170 L600 200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <rect x="440" y="200" width="320" height="40" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="600" y="225" font-size="13" fill="#1b5e20" text-anchor="middle">→ The quick brown fox jumps over the lazy dog</text>
  
  <text x="600" y="270" font-size="12" fill="#666" text-anchor="middle">重建整个序列（生成友好）</text>
  
  <!-- 底部说明 -->
  <text x="400" y="330" font-size="13" fill="#444" text-anchor="middle">共同点：Encoder-Decoder 架构 · 双向编码 + 因果解码</text>
  <text x="400" y="355" font-size="12" fill="#888" text-anchor="middle">差异：T5 只预测被破坏部分 | BART 重建完整输入</text>
  
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
