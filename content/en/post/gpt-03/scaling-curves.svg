<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="#fafafa" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">模型规模 vs 性能：Scale 对 In-Context Learning 的影响</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="420" x2="720" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="80" y1="420" x2="80" y2="50" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="730" y="425" font-size="12" fill="#333" font-weight="bold">模型参数</text>
  <text x="60" y="45" font-size="12" fill="#333" font-weight="bold">性能</text>

  <!-- X 轴刻度（对数尺度） -->
  <text x="80" y="440" text-anchor="middle" font-size="10" fill="#666">125M</text>
  <text x="200" y="440" text-anchor="middle" font-size="10" fill="#666">760M</text>
  <text x="340" y="440" text-anchor="middle" font-size="10" fill="#666">2.7B</text>
  <text x="480" y="440" text-anchor="middle" font-size="10" fill="#666">13B</text>
  <text x="620" y="440" text-anchor="middle" font-size="10" fill="#666">175B</text>

  <!-- Y 轴刻度 -->
  <text x="70" y="370" text-anchor="end" font-size="10" fill="#666">25%</text>
  <text x="70" y="300" text-anchor="end" font-size="10" fill="#666">50%</text>
  <text x="70" y="230" text-anchor="end" font-size="10" fill="#666">75%</text>
  <text x="70" y="160" text-anchor="end" font-size="10" fill="#666">100%</text>

  <!-- 网格线 -->
  <line x1="80" y1="370" x2="720" y2="370" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="300" x2="720" y2="300" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="230" x2="720" y2="230" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="160" x2="720" y2="160" stroke="#eee" stroke-width="1"/>

  <line x1="200" y1="50" x2="200" y2="420" stroke="#eee" stroke-width="1"/>
  <line x1="340" y1="50" x2="340" y2="420" stroke="#eee" stroke-width="1"/>
  <line x1="480" y1="50" x2="480" y2="420" stroke="#eee" stroke-width="1"/>
  <line x1="620" y1="50" x2="620" y2="420" stroke="#eee" stroke-width="1"/>

  <!-- Zero-Shot 曲线（平缓） -->
  <!-- 125M→760M→2.7B→13B→175B -->
  <!-- Y: 420→395→370→345→310 -->
  <polyline points="80,410 200,395 340,375 480,345 620,300" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="80" cy="410" r="5" fill="#3b82f6"/>
  <circle cx="200" cy="395" r="5" fill="#3b82f6"/>
  <circle cx="340" cy="375" r="5" fill="#3b82f6"/>
  <circle cx="480" cy="345" r="5" fill="#3b82f6"/>
  <circle cx="620" cy="300" r="5" fill="#3b82f6"/>

  <!-- One-Shot 曲线（较陡） -->
  <!-- Y: 420→390→350→300→240 -->
  <polyline points="80,412 200,390 340,350 480,300 620,240" fill="none" stroke="#22c55e" stroke-width="3"/>
  <circle cx="80" cy="412" r="5" fill="#22c55e"/>
  <circle cx="200" cy="390" r="5" fill="#22c55e"/>
  <circle cx="340" cy="350" r="5" fill="#22c55e"/>
  <circle cx="480" cy="300" r="5" fill="#22c55e"/>
  <circle cx="620" cy="240" r="5" fill="#22c55e"/>

  <!-- Few-Shot 曲线（最陡 - 超线性） -->
  <!-- Y: 420→385→320→220→130 -->
  <polyline points="80,418 200,385 340,320 480,220 620,130" fill="none" stroke="#ef4444" stroke-width="3"/>
  <circle cx="80" cy="418" r="5" fill="#ef4444"/>
  <circle cx="200" cy="385" r="5" fill="#ef4444"/>
  <circle cx="340" cy="320" r="5" fill="#ef4444"/>
  <circle cx="480" cy="220" r="5" fill="#ef4444"/>
  <circle cx="620" cy="130" r="5" fill="#ef4444"/>

  <!-- 图例 -->
  <rect x="550" y="55" width="12" height="12" fill="#3b82f6"/>
  <text x="568" y="66" font-size="12" fill="#333">Zero-Shot</text>
  <rect x="550" y="75" width="12" height="12" fill="#22c55e"/>
  <text x="568" y="86" font-size="12" fill="#333">One-Shot</text>
  <rect x="550" y="95" width="12" height="12" fill="#ef4444"/>
  <text x="568" y="106" font-size="12" fill="#333">Few-Shot</text>

  <text x="400" y="490" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">结论：模型越大，In-Context Learning 能力越强，Few-Shot 呈现超线性增长</text>

  <!-- 标注 -->
  <text x="620" y="120" text-anchor="middle" font-size="10" fill="#ef4444">超线性增长</text>
  <text x="620" y="290" text-anchor="middle" font-size="10" fill="#3b82f6">稳步提升</text>
</svg>